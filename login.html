<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecionando… — MAPA</title>
  <meta name="robots" content="noindex">
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#002b5e,#075f82);font-family:system-ui,Segoe UI,sans-serif;color:#fff">
  <div style="text-align:center">
    <div style="width:2.4rem;height:2.4rem;margin:0 auto 14px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite"></div>
    <p style="opacity:.9;font-size:.92rem">Redirecionando para o login…</p>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <script>
    // O login do MAPA passou a ser feito inteiramente pelo Controle de Acesso
    // CENTRAL. Esta página só existe para não deixar links/favoritos antigos
    // quebrados — redireciona sempre para /central/login.html.
    (function () {
      var next = new URLSearchParams(location.search).get('next');
      var destino = '/mapa-sme/index.html';
      if (next && /^[\w.\-]+\.html(\?[\w%=&.\-]*)?$/.test(next)) destino = '/mapa-sme/' + next;
      location.replace('/central/login.html?next=' + encodeURIComponent(destino));
    })();
  </script>
</body>
</html>
