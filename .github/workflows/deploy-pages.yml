name: Deploy GitHub Pages (produção + homologação)

on:
  push:
    branches: [main, develop]
  workflow_dispatch:   # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dois deploys rodem ao mesmo tempo e se atropelem
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar main (produção)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _src/main

      - name: Baixar develop (homologação)
        uses: actions/checkout@v4
        with:
          ref: develop
          path: _src/develop

      # As telas -v2 são cópias das originais com a pele nova por cima. Quando
      # alguém altera uma tela e não roda o gerador, a cópia publicada em
      # /teste passa a mostrar uma versão antiga do sistema — e o defeito é
      # silencioso, porque a página continua abrindo. Gerar aqui tira isso da
      # memória de quem publica.
      #
      # Roda só dentro de _src/develop. Os scripts trabalham sempre na pasta
      # acima de tools/, então a cópia da main (produção) não é alcançada.
      - name: Gerar as páginas -v2 da homologação
        id: v2
        continue-on-error: true   # falha aqui não pode derrubar a produção
        run: |
          if [ -f _src/develop/tools/gerar-v2.py ]; then
            python3 _src/develop/tools/gerar-v2.py
          else
            echo "A develop não tem tools/gerar-v2.py — nada a gerar."
          fi

      - name: Avisar se a geração falhou
        if: steps.v2.outcome == 'failure'
        run: |
          echo "⚠️ A geração das páginas -v2 falhou." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "O site foi publicado assim mesmo, com as cópias -v2 que estavam versionadas na develop. Elas podem estar atrasadas em relação às telas originais. Veja o log do passo *Gerar as páginas -v2 da homologação*." >> "$GITHUB_STEP_SUMMARY"

      - name: Montar o site (main na raiz, develop em /teste)
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' _src/main/ _site/
          mkdir -p _site/teste
          rsync -a --exclude='.git' --exclude='.github' _src/develop/ _site/teste/
          touch _site/.nojekyll

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
