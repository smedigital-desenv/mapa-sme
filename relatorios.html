<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script src="auth-guard.js"></script>
  <script>window.MAPA_SISTEMA = 'mapa';</script>
  <script src="auth.js" defer></script>
  <script src="config-central.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_top">
  <title>Relatórios de Acompanhamento</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    /* ── Variáveis ── */
    :root {
      --primary: #002b5e;
      --neon-green: #39FF14;
      --neon-pink: #FF007F;
      --neon-yellow: #FFD300;
      --neon-blue: #00e5ff;
      --bg: #f0f4f8;
    }
    body { background-color: var(--bg); font-family: 'Inter', sans-serif; padding-bottom: 50px; min-height: 100vh; display: flex; flex-direction: column; }
    /* ── Cabeçalho global MAPA (igual ao atribuicao.html) ── */
    .mg-header { background: var(--primary, #002b5e); color: #fff; border-bottom: 5px solid var(--neon-blue, #00e5ff); padding: .95rem 1.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; position: sticky; top: 0; z-index: 1050; box-shadow: 0 6px 18px rgba(0,43,94,.18); }
    .mg-brand { display: flex; align-items: center; gap: .6rem; min-width: 180px; }
    .mg-brand-icon { width: 34px; height: 34px; display: grid; place-items: center; color: var(--neon-blue, #00e5ff); font-size: 1.4rem; filter: drop-shadow(0 0 6px rgba(0,229,255,.55)); }
    .mg-brand h4 { margin: 0; font-weight: 900; letter-spacing: .03em; font-size: 1.4rem; line-height: 1; }
    .mg-brand-sub { font-size: .63rem; color: rgba(255,255,255,.68); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
    .mg-nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; flex: 1; min-width: 280px; }
    .mg-nav-btn { display: inline-flex; align-items: center; gap: .4rem; justify-content: center; min-width: 150px; font-size: .78rem; font-weight: 900; padding: 6px 14px; border-radius: 8px; border: 2px solid transparent; color: #fff; text-decoration: none; transition: .2s; white-space: nowrap; }
    .mg-nav-btn:hover { border-color: rgba(255,255,255,.4); }
    .mg-nav-btn.active { background: #fff; color: var(--primary, #002b5e); box-shadow: 0 2px 10px rgba(0,0,0,.18); }
    .mg-actions { min-width: 86px; display: flex; justify-content: flex-end; align-items: center; }
    .mg-action-btn { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; font-weight: 800; padding: 5px 12px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.45); background: transparent; color: #fff; cursor: pointer; transition: .2s; }
    .mg-action-btn:hover { background: rgba(255,255,255,.12); border-color: #fff; }
    @media (max-width: 992px) { .mg-nav-btn { min-width: auto; } }
    .nav-header { background: var(--primary); color: white; padding: 1.2rem 2rem; border-bottom: 5px solid var(--neon-blue); z-index: 1040; }
    .btn-toggle { border: 2px solid var(--neon-blue); color: white; font-weight: 700; margin-right: 10px; border-radius: 8px; transition: 0.3s; background: transparent; padding: 6px 16px; }
    .btn-toggle:hover { background: rgba(0,229,255,0.1); color: white; }
    .btn-toggle.active { background: var(--neon-blue); color: var(--primary); box-shadow: 0 0 12px var(--neon-blue); }
    .tab-badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; border-radius: 20px; background: var(--neon-pink); color: white; font-size: 0.7rem; font-weight: 800; padding: 0 6px; margin-left: 6px; }
    .card-kpi { border: none; border-radius: 12px; background: white; padding: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .chart-container { background: white; border-radius: 15px; padding: 1.2rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .table-container { background: white; border-radius: 15px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .btn-action { font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; transition: 0.2s; border-radius: 8px; }
    .btn-action-primary { background-color: var(--primary); color: white; border: 1px solid var(--primary); }
    .btn-action-primary:hover { background-color: #001a3d; color: white; box-shadow: 0 4px 10px rgba(0,43,94,0.3); transform: scale(1.02); }
    .btn-action-ia { background-color: white; color: var(--primary); border: 2px solid var(--neon-blue); }
    .btn-action-ia:hover { background-color: var(--neon-blue); color: var(--primary); box-shadow: 0 0 10px var(--neon-blue); transform: scale(1.02); }
    .layout-wrapper { display: flex; gap: 1.5rem; padding: 1.5rem; max-width: 1600px; margin: 0 auto; width: 100%; align-items: flex-start; }
    aside { width: 300px; flex-shrink: 0; position: sticky; top: calc(80px + 1.5rem); display: flex; flex-direction: column; gap: 1rem; }
    main { flex-grow: 1; min-width: 0; }
    .sel-bar { background: #f8faff; border: 1px solid var(--neon-blue); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .sel-bar-titulo { font-size: 0.75rem; font-weight: 800; color: var(--primary); text-transform: uppercase; }
    #contadorSel { font-size: 0.85rem; font-weight: 700; color: var(--neon-pink); }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
    /* ── Agrupamento por regional ── */
    .regional-group { background:#fff; border-radius:14px; box-shadow:0 4px 14px rgba(0,0,0,.05); margin-bottom:16px; overflow:hidden; }
    .regional-group-header { display:flex; align-items:center; gap:10px; padding:13px 18px; cursor:pointer; border-left:5px solid var(--neon-blue); transition:.15s; user-select:none; }
    .regional-group-header:hover { background:#f8faff; }
    .regional-group-nome { font-weight:900; color:var(--primary); font-size:1rem; }
    .regional-group-meta { font-size:.75rem; font-weight:700; color:#64748b; }
    .regional-group-chevron { margin-left:auto; color:#94a3b8; transition:transform .2s; }
    .regional-group-header.collapsed .regional-group-chevron { transform:rotate(-90deg); }
    .regional-group-body { padding:0 18px 18px; }
    .rel-card { cursor: pointer; transition: all 0.2s ease; border: 2px solid transparent; position: relative; display: flex; flex-direction: column; gap: 10px; }
    .rel-card:hover { border-color: var(--neon-blue); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }
    .rel-card.selecionado { border-color: var(--neon-pink); background-color: #fffafc; box-shadow: 0 0 0 3px rgba(255,0,127,0.1); }
    .card-checkbox-wrap { position: absolute; top: 15px; right: 15px; z-index: 2; }
    .card-checkbox { width: 20px; height: 20px; cursor: pointer; accent-color: var(--neon-pink); }
    .card-title-escola { font-weight: 800; font-size: 0.95rem; color: var(--primary); line-height: 1.2; padding-right: 30px; }
    .card-meta-info { font-size: 0.75rem; font-weight: 600; color: #6c757d; }
    .estado { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4rem 2rem; text-align: center; color: #adb5bd; }
    .estado i { font-size: 3rem; margin-bottom: 1rem; color: #dee2e6; }
    .estado p { font-weight: 600; font-size: 1.1rem; }
    .spinner-wrapper { display: flex; justify-content: center; padding: 4rem; }
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 25px; border-radius: 30px; font-weight: 700; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 25px rgba(0,43,94,0.3); border: 2px solid var(--neon-green); opacity: 0; pointer-events: none; transition: 0.3s; z-index: 9999; }
    #toast.visivel { opacity: 1; transform: translateX(-50%) translateY(-10px); }
    .search-wrap { position: relative; }
    .search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #adb5bd; }
    .search-wrap input { padding-left: 36px; font-weight: 500; }
    @media (max-width: 768px) { .layout-wrapper { flex-direction: column; } aside { width: 100%; position: static; } }
    /* ── Abas + opções de PDF dentro do modal ── */
    .modal-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .modal-tabs .nav-link { border: 2px solid #cbd5e1; background: #fff; color: #334155; font-weight: 800; font-size: 0.85rem; padding: 7px 18px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; transition: .15s; }
    .modal-tabs .nav-link:hover { border-color: var(--primary); }
    .modal-tabs .nav-link.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pdf-opt { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 700; color: #334155; cursor: pointer; margin: 0; }
    .pdf-opt input { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }
    /* ── Estatísticas / cobertura ── */
    .est-kpis-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(132px, 1fr)); gap:.85rem; }
    .est-kpi { background:#fff; border-radius:14px; padding:.9rem 1.1rem; box-shadow:0 4px 14px rgba(0,0,0,.05); border-left:5px solid var(--primary); height:100%; }
    .est-kpi .lbl { font-size:.66rem; font-weight:800; color:#64748b; text-transform:uppercase; letter-spacing:.03em; }
    .est-kpi .val { font-size:1.7rem; font-weight:900; color:var(--primary); line-height:1.1; }
    .est-kpi.ok    { border-left-color:#10b981; } .est-kpi.ok .val    { color:#047857; }
    .est-kpi.warn  { border-left-color:#ef4444; } .est-kpi.warn .val  { color:#b91c1c; }
    .est-kpi.info  { border-left-color:var(--neon-blue); }
    .est-kpi.dev   { border-left-color:var(--neon-pink); } .est-kpi.dev .val { color:#be185d; }
    .est-kpi.clic  { cursor:pointer; transition:transform .12s, box-shadow .12s; }
    .est-kpi.clic:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,.12); }
    .est-kpi.ativo { box-shadow:0 0 0 3px rgba(0,43,94,.30), 0 4px 14px rgba(0,0,0,.06); }
    table.tbl-cob { width:100%; font-size:.84rem; border-collapse:collapse; }
    table.tbl-cob thead th { position:sticky; top:0; background:var(--primary); color:#fff; font-weight:800; font-size:.68rem; text-transform:uppercase; letter-spacing:.02em; padding:9px 10px; white-space:nowrap; cursor:pointer; }
    table.tbl-cob tbody td { padding:7px 10px; border-bottom:1px solid #eef2f7; }
    table.tbl-cob tbody tr:hover { background:#f1f6ff; }
    .pill { font-weight:800; font-size:.66rem; padding:3px 9px; border-radius:999px; white-space:nowrap; }
    .pill-ok   { background:#d1fae5; color:#047857; }
    .pill-no   { background:#fee2e2; color:#b91c1c; }
    .pill-dev  { background:#fce7f3; color:#be185d; }
    .pill-risco-alto  { background:#fee2e2; color:#b91c1c; }
    .pill-risco-medio { background:#fef3c7; color:#b45309; }
    .pill-risco-baixo { background:#d1fae5; color:#047857; }
    /* ── Painéis analíticos da aba Estatísticas ── */
    .est-paineis { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:1rem; margin:0 0 1.1rem; }
    .est-painel { background:#fff; border-radius:14px; padding:1rem 1.15rem; box-shadow:0 4px 14px rgba(0,0,0,.05); }
    .est-painel-wide { grid-column:1 / -1; }
    .est-painel-tit { font-weight:900; color:var(--primary); font-size:.9rem; margin-bottom:.8rem; display:flex; align-items:center; gap:.35rem; }
    .est-painel-nota { font-size:.68rem; color:#94a3b8; margin-top:.7rem; font-weight:600; }
    /* Cobertura por regional */
    .pr-lista { display:flex; flex-direction:column; gap:.5rem; max-height:270px; overflow:auto; }
    .pr-linha { display:grid; grid-template-columns:minmax(90px,1.4fr) 3fr minmax(78px,auto); align-items:center; gap:.6rem; padding:.15rem .1rem; border-radius:8px; }
    .pr-linha.clic { cursor:pointer; } .pr-linha.clic:hover { background:#f1f6ff; }
    .pr-nome { font-size:.76rem; font-weight:700; color:#334155; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pr-barra { background:#eef2f7; border-radius:999px; height:12px; overflow:hidden; }
    .pr-fill { height:100%; border-radius:999px; transition:width .3s; }
    .pr-num { font-size:.72rem; font-weight:700; color:#475569; white-space:nowrap; text-align:right; }
    /* Chips (risco / idade) */
    .risco-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(84px,1fr)); gap:.6rem; }
    .risco-chip, .idade-chip { border:2px solid var(--rc,var(--ic,#e2e8f0)); border-radius:12px; padding:.55rem .3rem; text-align:center; background:#fff; }
    .idade-chip { border-color:var(--ic); }
    .risco-chip.clic, .idade-chip.clic { cursor:pointer; transition:transform .12s, box-shadow .12s; }
    .risco-chip.clic:hover, .idade-chip.clic:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.10); }
    .risco-chip.ativo, .idade-chip.ativo { box-shadow:0 0 0 3px rgba(0,43,94,.18); }
    .rc-val { font-size:1.5rem; font-weight:900; color:var(--rc,var(--ic,#334155)); line-height:1; }
    .rc-lbl { font-size:.64rem; font-weight:800; text-transform:uppercase; letter-spacing:.02em; color:#64748b; margin-top:.2rem; }
    /* Temas recorrentes */
    .tema-lista { display:flex; flex-direction:column; gap:.42rem; max-height:290px; overflow:auto; }
    .tema-linha { display:grid; grid-template-columns:minmax(96px,1.3fr) 3fr 28px; align-items:center; gap:.55rem; }
    .tema-nome { font-size:.75rem; font-weight:700; color:#334155; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .tema-barra { background:#eef2f7; border-radius:999px; height:10px; overflow:hidden; }
    .tema-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,#6f42c1,#00b4d8); }
    .tema-num { font-size:.72rem; font-weight:800; color:#475569; text-align:right; }
    .tema-linha.clic { cursor:pointer; padding:.1rem .25rem; border-radius:7px; }
    .tema-linha.clic:hover { background:#f1f6ff; }
    .tema-linha.ativo { background:#e0f2fe; box-shadow:inset 0 0 0 2px #00b4d8; }
    /* Heatmap tema × regional */
    .hm-wrap { overflow-x:auto; }
    .hm-tbl { border-collapse:collapse; font-size:.74rem; min-width:100%; }
    .hm-tbl th, .hm-tbl td { border:1px solid #eef2f7; }
    .hm-canto { text-align:left; padding:6px 8px; font-weight:800; color:#64748b; background:#f8fafc; position:sticky; left:0; z-index:2; }
    .hm-rot { padding:6px 4px; font-weight:800; color:#475569; background:#f8fafc; text-align:center; white-space:nowrap; }
    .hm-tema { text-align:left; padding:5px 8px; font-weight:700; color:#334155; white-space:nowrap; background:#fff; position:sticky; left:0; z-index:1; }
    .hm-tot { color:#94a3b8; font-weight:800; font-size:.66rem; }
    .hm-cel { text-align:center; font-weight:800; padding:5px 6px; min-width:34px; }
    /* Leitura da rede (síntese IA) */
    .lr-grid { display:flex; flex-direction:column; gap:1rem; }
    .lr-bloco { border-left:4px solid var(--neon-blue); background:#f8fbff; border-radius:0 10px 10px 0; padding:.8rem 1rem; }
    .lr-cab { font-weight:900; color:var(--primary); font-size:.9rem; margin-bottom:.4rem; }
    .lr-modelo { font-size:.6rem; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:#0369a1; background:#e0f2fe; border-radius:999px; padding:1px 8px; margin-left:.4rem; vertical-align:middle; }
    .lr-sintese { font-size:.82rem; color:#334155; line-height:1.5; margin-bottom:.7rem; }
    .lr-cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:.7rem 1.2rem; }
    .lr-sec-tit { font-size:.7rem; font-weight:900; text-transform:uppercase; letter-spacing:.03em; margin-bottom:.25rem; }
    .lr-ul { margin:0; padding-left:1.1rem; }
    .lr-ul li { font-size:.76rem; color:#475569; line-height:1.4; margin-bottom:.18rem; }
    .lr-niv { font-size:.6rem; font-weight:800; text-transform:uppercase; color:#b45309; background:#fef3c7; border-radius:999px; padding:0 6px; }
    /* Backlog de devolutivas */
    .backlog-lista { display:flex; flex-direction:column; gap:.4rem; max-height:290px; overflow:auto; }
    .backlog-item { padding:.4rem .55rem; border-left:3px solid #f59e0b; background:#fffbeb; border-radius:0 8px 8px 0; }
    .bk-nome { font-size:.78rem; font-weight:800; color:#1e293b; }
    .bk-meta { font-size:.68rem; color:#94a3b8; font-weight:600; }
    .bk-badge { background:#f59e0b; color:#fff; font-weight:900; border-radius:999px; padding:1px 10px; font-size:.78rem; margin-left:.4rem; }
    .bk-badge.clic { cursor:pointer; } .bk-badge.clic:hover { background:#d97706; }
    .backlog-vazio { font-size:.8rem; font-weight:700; color:#047857; background:#ecfdf5; border-radius:10px; padding:.7rem .9rem; }
    /* ── Assistente (chatbot) ── */
    .chat-wrap { display:flex; flex-direction:column; height:calc(100vh - 190px); min-height:420px; background:#fff; border-radius:16px; box-shadow:0 4px 18px rgba(0,0,0,.06); overflow:hidden; }
    .chat-top { padding:.85rem 1.15rem; border-bottom:1px solid #eef2f7; display:flex; align-items:center; gap:.6rem; }
    .chat-top .tit { font-weight:900; color:var(--primary); font-size:.98rem; }
    .chat-top .sub { font-size:.68rem; color:#94a3b8; font-weight:600; }
    .chat-msgs { flex:1; overflow-y:auto; padding:1.1rem 1.15rem; display:flex; flex-direction:column; gap:.75rem; background:#f8fafc; }
    .chat-b { max-width:82%; padding:.7rem .95rem; border-radius:14px; font-size:.86rem; line-height:1.5; white-space:normal; word-wrap:break-word; }
    .chat-b.user { align-self:flex-end; background:var(--primary); color:#fff; border-bottom-right-radius:4px; }
    .chat-b.bot  { align-self:flex-start; background:#fff; color:#1e293b; border:1px solid #e8eef5; border-bottom-left-radius:4px; }
    .chat-b.bot strong { color:var(--primary); }
    .chat-vazio { margin:auto; text-align:center; color:#94a3b8; max-width:460px; }
    .chat-vazio i { font-size:2.4rem; color:#cbd5e1; }
    .chat-vazio p { font-size:.85rem; font-weight:600; margin-top:.5rem; }
    .chat-typing { align-self:flex-start; display:flex; gap:4px; padding:.7rem .95rem; }
    .chat-typing span { width:7px; height:7px; border-radius:50%; background:#cbd5e1; animation:chatpulse 1.2s infinite; }
    .chat-typing span:nth-child(2){ animation-delay:.2s; } .chat-typing span:nth-child(3){ animation-delay:.4s; }
    @keyframes chatpulse { 0%,60%,100%{opacity:.3;transform:translateY(0);} 30%{opacity:1;transform:translateY(-3px);} }
    .chat-chips { display:flex; flex-wrap:wrap; gap:.45rem; padding:.7rem 1.15rem 0; }
    .chat-chip { border:1.5px solid #cbd5e1; background:#fff; color:#334155; font-weight:700; font-size:.74rem; padding:5px 12px; border-radius:999px; cursor:pointer; transition:.15s; }
    .chat-chip:hover { border-color:var(--primary); background:#f1f6ff; }
    .chat-input { display:flex; gap:.6rem; padding:.85rem 1.15rem; border-top:1px solid #eef2f7; align-items:flex-end; }
    .chat-input textarea { flex:1; resize:none; border:1.5px solid #cbd5e1; border-radius:12px; padding:.6rem .85rem; font-family:inherit; font-size:.86rem; max-height:120px; }
    .chat-input textarea:focus { outline:none; border-color:var(--primary); }
    .chat-send { border:0; background:var(--primary); color:#fff; width:44px; height:44px; border-radius:12px; cursor:pointer; flex-shrink:0; font-size:1.1rem; }
    .chat-send:disabled { opacity:.5; cursor:not-allowed; }
    /* ── Área de impressão / PDF ── */
    #print-area { display: none; }
    .pdf-cab { display:flex; align-items:baseline; gap:12px; border-bottom:3px solid var(--primary); padding-bottom:10px; margin-bottom:20px; flex-wrap:wrap; }
    .pdf-cab-marca { font-weight:900; font-size:1.35rem; color:var(--primary); letter-spacing:.02em; }
    .pdf-cab-marca i { color:var(--neon-blue); margin-right:4px; }
    .pdf-cab-marca span { font-size:.7rem; font-weight:800; color:#64748b; letter-spacing:.04em; }
    .pdf-cab-sub { font-size:.78rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:#475569; }
    .pdf-cab-data { margin-left:auto; font-size:.7rem; color:#94a3b8; font-family:monospace; }
    .pdf-rodape { margin-top:22px; padding-top:10px; border-top:1px solid #e2e8f0; font-size:.66rem; color:#94a3b8; display:flex; justify-content:space-between; }
    @page { size: A4; margin: 14mm 13mm; }
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body { background:#fff !important; }
      body > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; font-family:'Inter',sans-serif; color:#1e293b; }
      .pdf-sec { page-break-after: always; font-size: 10.5pt; line-height: 1.45; }

<script>
// ── Configuração ──
const COL_REGIONAL = "Marque a Regional a qual pertente a unidade escolar.";
const COLS_FICHA = [
  "Carimbo de data/hora","Data da Visita:","Data da visita:",
  "Assinale o período da visita.",
  "Nome(s) do(s) responsável(is) pelo acompanhamento pedagógico.",
  "Endereço de e-mail",
  COL_REGIONAL
];
// Pergunta usada só para extrair a escola (coluna F) nos formulários "2" — já exibida
// como nome da escola no card/relatório, então nunca deve aparecer como campo solto.
const COL_ESCOLA_PERGUNTA = "Assinale a unidade escolar visitada.";
const ROTULOS = {
  "Carimbo de data/hora":"Enviado em",
  "Data da Visita:":"Data da visita",
  "Data da visita:":"Data da visita",
  "Assinale o período da visita.":"Período",
  "Nome(s) do(s) responsável(is) pelo acompanhamento pedagógico.":"Responsável(is)",
  "Endereço de e-mail":"E-mail",
  // ── Fundamental2 / Infantil2 (visita de diálogo/PPA/boas práticas) ──
  "Foi possível dialogar com os(as) gestores(as) da unidade escolar?\nSe sim, relate brevemente este diálogo. \nE caso não tenha sido possível, descreva o motivo.":"Diálogo com gestores(as)",
  "Foi possível dialogar com o(a) coordenador(a) pedagógico(a) da unidade escolar?\nSe sim, relate brevemente este diálogo. \nE caso não tenha sido possível, descreva o motivo.":"Diálogo com coordenação pedagógica",
  "Foi possível dialogar com o(a) gestor(a) da unidade escolar?\nSe sim, relate brevemente este diálogo. \nE caso não tenha sido possível, descreva o motivo.":"Diálogo com gestor(a)",
  "Foi possível analisar a organização de horários do PPA (Projeto Professor Alfabetizador)?":"Organização de horários do PPA",
  "Escreva brevemente como está sendo desenvolvido este projeto no 2º ano.":"Desenvolvimento do PPA no 2º ano",
  "Relate as boas práticas identificadas.":"Boas práticas identificadas",
  "Sendo possível, anexe fotos de Boas Práticas da unidade escolar.":"Fotos de boas práticas",
  "Relate pontos de atenção nas turmas de 1ºs e 2ºs anos.":"Pontos de atenção (1ºs e 2ºs anos)",
  "Aponte as devolutivas necessárias para a próxima visita a ser agendada.":"Devolutivas para a próxima visita",
  "Identificação e descrição de práticas pedagógicas observadas com intencionalidade educativa.\nAnálise das boas práticas docentes evidenciadas no contexto observado.":"Práticas pedagógicas observadas / boas práticas docentes",
  "Identificação das devolutivas pedagógicas necessárias para acompanhamento na próxima visita.\nPlanejamento de orientações e encaminhamentos para continuidade do processo formativo.":"Devolutivas e encaminhamentos para a próxima visita",
  "Explique quais os pontos de atenção.":"Pontos de atenção"
};

// ── Estado global ──
// Identidade/admin vêm do sistema global de login (auth.js / window.MapaAuth):
//  - estaLogado: a página só carrega após a sessão global (auth.js redireciona ao
//    login se não houver sessão), então é verdadeiro assim que MapaAuth está pronto.
//  - isAdmin: super admin do sistema (perfil.is_super_admin).
let dadosPorSegmento = { fundamental: [], infantil: [] };
let isAdmin = false;
let estaLogado = false;
let emailUsuario = '';
let escolasOficiais = { fundamental: [], infantil: [] };
let mapaRegionalOficial = { fundamental: {}, infantil: {} };
let segmentoAtual = 'fundamental';
let secaoAtual = 'fundamental';
let todos = [], filtrados = [], selecionados = new Set();
let todasDevolutivas = [], devolutivasFiltradas = [];
let devolutivasCarregadas = false;
let mapaDevolutivas = new Map();

// ── Índice visita ↔ devolutiva (chave: segmento|escola|data) ──
function _chaveDev(seg, escola, data) {
  return (String(seg||'') + '|' + String(escola||'') + '|' + String(data||''))
    .toLowerCase().replace(/\s+/g, ' ').trim();
}
// Agrupa as devolutivas por visita (segmento|escola|data). Quando há mais de uma
// versão (ex.: Gemini e Claude), a MAIS RECENTE vira a principal e as demais ficam
// em ._versoes para o seletor de comparação no modal.
function _construirMapaDevolutivas() {
  mapaDevolutivas = new Map();
  const grupos = new Map();
  todasDevolutivas.forEach(d => {
    const k = _chaveDev(d["Segmento"], d["Escola"], d["Data da Visita"]);
    if (!grupos.has(k)) grupos.set(k, []);
    grupos.get(k).push(d);
  });
  grupos.forEach((versoes, k) => {
    versoes.sort((a, b) => _tsDev(b) - _tsDev(a));   // mais recente primeiro
    const principal = versoes[0];
    principal._versoes = versoes;
    mapaDevolutivas.set(k, principal);
  });
}

// timestamp de uma devolutiva (aceita ISO em _salvoEmRaw ou "dd/MM/yyyy HH:mm" em "Salvo em")
function _tsDev(d) {
  const raw = d._salvoEmRaw || '';
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) { const t = Date.parse(raw); if (!isNaN(t)) return t; }
  const m = String(d["Salvo em"] || '').match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  return m ? new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0)).getTime() : 0;
}

// Rótulo amigável do modelo que gerou a devolutiva (para o seletor de versões).
function _rotuloModelo(m) {
  const s = String(m || '').toLowerCase();
  if (!s) return '';
  if (s === 'gemini' || s.startsWith('gemini')) return 'Gemini';
  if (s.startsWith('claude')) return 'Claude' + (s.length > 6 ? ' ' + m.slice(6).replace(/^[-\s]+/, '') : '');
  return m;
}
function _devDoItem(item) {
  const data = item["Data da Visita:"]||item["Data da visita:"]||'';
  return mapaDevolutivas.get(_chaveDev(item['_SEGMENTO_']||segmentoAtual, item['_ESCOLA_'], data));
}

// ── Toast ──
function mostrarToast(msg) {
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;

  setTimeout(() => el.classList.remove('visivel'), 3000);

// ── Utilitários ──
function escapar(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mostrarEstado(msg, icone) {

}

// ── Navegação ──
function mudarSecao(sec) {
  secaoAtual = sec;
  ['fundamental','infantil','devolutivas','estatisticas','assistente'].forEach(t => {
    const b = document.getElementById('tab-'+t);
    if (b) b.classList.toggle('active', t === sec);
  });
  const aP = document.getElementById('aside-principal');
  const aD = document.getElementById('aside-dev');
  const aE = document.getElementById('aside-estatisticas');

  document.getElementById('badgeCount').style.display = 'none';
  if (sec === 'devolutivas') {
    aD.style.display = 'flex'; carregarDevolutivas();
  } else if (sec === 'estatisticas') {
    aE.style.display = 'flex'; renderEstatisticas();
  } else if (sec === 'assistente') {
    renderAssistente();                 // sem barra lateral: o chat ocupa a área toda
  } else {
    aP.style.display = 'flex'; mudarSegmento(sec);
  }
}

// ── URL da API (Google Apps Script) ──
const API_URL = 'https://script.google.com/macros/s/AKfycbx8s-6lhTckvshmop6c_tvV_hVZqC6JjXtuQVpN0U6sjjB9oXtCb3gTdHK27V_YjkfKBQ/exec';

// ── Origem dos dados ──
// 'appsscript': lê do Google Apps Script/Planilhas, como sempre.
// 'supabase': lê do Supabase (RPCs relat_visitas/relat_devolutivas + relatorios_escolas),
//   com isolamento por escola no servidor (RLS). Ver apps-script/relatorios/supabase-migracao.md.
// Padrão seguro: enquanto validamos, a origem pode ser forçada pela URL (?fonte=supabase
// ou ?fonte=appsscript). Para virar de vez, troque _FONTE_PADRAO para 'supabase'.
const _FONTE_PADRAO = 'supabase';
const FONTE_DADOS = (new URLSearchParams(location.search).get('fonte') || _FONTE_PADRAO).toLowerCase();

// ── Carregamento ──
function carregarDados() {
  document.getElementById('main').innerHTML = '<div class="spinner-wrapper"><div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;"></div></div>';

  // Origem Supabase (quando ligada e o cliente global estiver pronto)
  if (FONTE_DADOS === 'supabase' && window.MAPA_SB) {
    _carregarDadosSupabase().catch(err => {
      console.error('Falha ao carregar do Supabase:', err);
      onErro(err);
    });
    return;
  }

  // Detecta se está rodando em Google Apps Script ou como arquivo estático
  if (typeof google !== 'undefined' && google.script) {
    // Modo Google Apps Script
    google.script.run.withSuccessHandler(onDados).withFailureHandler(onErro).getDadosCompletos();
  } else {
    // Modo externo: faz fetch para a API do Apps Script
    chamarAPI('getDados')
      .then(res => {
        if (res.ok || res.fundamental) {
          onDados(res);
        } else {
          console.warn('⚠️ Erro ao carregar dados reais. Usando dados de teste.');
          onDados(_dadosMock());
        }
      })
      .catch(err => {
        console.warn('⚠️ Não conseguiu conectar à API. Usando dados de teste.', err);
        onDados(_dadosMock());
      });
  }
}

// ── Leitura via Supabase ───────────────────────────────────────────────────
// Monta o mesmo formato que onDados() já espera, reaproveitando toda a lógica
// (tag de _SEGMENTO_, merge base+"2", filtros, cobertura). O RLS já filtra por
// escola no servidor, então não é preciso o isolamento no cliente aqui.
async function _carregarDadosSupabase() {
  const SB = window.MAPA_SB;
  const [visitasRes, escolasRes] = await Promise.all([
    SB.rpc('relat_visitas', {}),
    SB.rpc('relat_escolas', {})   // cadastro oficial (RPC em public → tabelas no schema)
  ]);
  if (visitasRes.error) throw visitasRes.error;

  const res = {
    fundamental: [], infantil: [], fundamental2: [], infantil2: [],
    escolasEMEF: [], escolasEMEI: [], regionalMapEMEF: {}, regionalMapEMEI: {}
  };

  (visitasRes.data || []).forEach(v => {
    const item = v.dados || {};
    if (!item['_SEGMENTO_']) item['_SEGMENTO_'] = v.segmento;
    if (!item['_ESCOLA_'])   item['_ESCOLA_']   = v.escola;
    (res[v.segmento] = res[v.segmento] || []).push(item);
  });

  // Cadastro oficial → cobertura (escolas sem visita). Se a tabela não existir/estiver
  // vazia, o front cai para o universo das escolas que aparecem nas visitas.
  if (!escolasRes.error) {
    (escolasRes.data || []).forEach(e => {
      if (e.segmento === 'fundamental') {
        res.escolasEMEF.push(e.nome);
        if (e.regional) res.regionalMapEMEF[e.nome] = e.regional;
      } else if (e.segmento === 'infantil') {
        res.escolasEMEI.push(e.nome);
        if (e.regional) res.regionalMapEMEI[e.nome] = e.regional;
      }
    });
  }

  onDados(res); // identidade/admin vêm do MapaAuth via _sincronizarAuthGlobal()
}

// Converte "Salvo em" (timestamptz ISO do Supabase) para dd/MM/yyyy HH:mm.
function _fmtTimestamp(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const p = n => ('0' + n).slice(-2);
  return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// Lê devolutivas do Supabase e devolve no mesmo formato de lerDevolutivas().
async function _lerDevolutivasSupabase() {
  const { data, error } = await window.MAPA_SB.rpc('relat_devolutivas', {});
  if (error) throw error;
  const registros = (data || []).map(r => ({
    "ID": r.id || '',
    "Escola": r.escola || '',
    "Segmento": r.segmento || '',
    "Data da Visita": r.data_visita || '',
    "Salvo em": _fmtTimestamp(r.salvo_em),
    "Regional": r.regional || '',
    "_tipo": r.tipo || 'individual',
    "_modelo": r.modelo || '',          // quem gerou (gemini | claude-…) — p/ comparar versões
    "_chave": r.chave || '',            // agrupa versões da mesma visita
    "_salvoEmRaw": r.salvo_em || '',    // timestamp bruto p/ ordenar versões
    "_dados": r.dados || {}
  }));
  return { ok: true, registros };
}

// ── Função auxiliar para chamar API ──
// Envia action + parâmetros no CORPO como application/x-www-form-urlencoded.
// Esse content-type é "simples" (CORS-safelisted), então não dispara preflight
// OPTIONS, e o Apps Script preenche e.parameter a partir do corpo. Isso permite
// payloads grandes (uma visita inteira, ou várias visitas de uma regional) que
// estourariam o limite de tamanho da URL se fossem por query string.
async function chamarAPI(action, params = {}) {
  try {
    const body = new URLSearchParams();
    body.append('action', action);
    Object.keys(params).forEach(key => body.append(key, params[key]));

    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: body.toString()
    });

    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } catch(err) {
    console.error('Erro ao chamar API:', err);
    throw err;
  }
}

// ── Chamada unificada (Apps Script embutido OU API externa) → Promise ──
// gasFn: nome da função no Code.gs; gasArg: argumento posicional.
// apiAction/apiParams: equivalente para o modo API externa (chamarAPI).
function _chamarBackend(gasFn, gasArg, apiAction, apiParams) {
  return new Promise((resolve, reject) => {
    if (typeof google !== 'undefined' && google.script) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[gasFn](gasArg);
    } else {
      chamarAPI(apiAction, apiParams).then(resolve).catch(reject);
    }
  });
}

function onDados(res) {
  // Isolamento por escola: usuário de escola só vê as visitas da sua unidade.
  try {
    if (res && window.MapaAuth && window.MapaAuth.restritoEscola) {
      const ok = n => window.MapaAuth.podeVerEscola(n);
      if (Array.isArray(res.fundamental))  res.fundamental  = res.fundamental.filter(d => ok(d['_ESCOLA_']));
      if (Array.isArray(res.infantil))     res.infantil     = res.infantil.filter(d => ok(d['_ESCOLA_']));
      if (Array.isArray(res.fundamental2)) res.fundamental2 = res.fundamental2.filter(d => ok(d['_ESCOLA_']));
      if (Array.isArray(res.infantil2))    res.infantil2    = res.infantil2.filter(d => ok(d['_ESCOLA_']));
      if (Array.isArray(res.escolasEMEF))  res.escolasEMEF  = res.escolasEMEF.filter(ok);
      if (Array.isArray(res.escolasEMEI))  res.escolasEMEI  = res.escolasEMEI.filter(ok);
    }
  } catch (e) {}
  if (res && (res.fundamental||res.infantil||res.fundamental2||res.infantil2)) {
    escolasOficiais.fundamental = res.escolasEMEF||[];
    escolasOficiais.infantil = res.escolasEMEI||[];
    mapaRegionalOficial.fundamental = res.regionalMapEMEF||{};
    mapaRegionalOficial.infantil = res.regionalMapEMEI||{};

    // Fundamental2/Infantil2 são um 2º formulário de visita (diálogo/PPA/boas práticas)
    // para as mesmas escolas. Aparecem junto com as visitas originais na mesma listagem
    // (mesmas abas Fundamental/Infantil), marcadas com _SEGMENTO_ para diferenciar a
    // origem (matching de devolutiva, prompt de IA, etc). Como esse formulário não
    // pergunta a regional, ela é preenchida aqui a partir do mapa oficial escola→regional.
    const tag = (arr, segOrigem, segBase) => (arr||[]).forEach(d => {
      d['_SEGMENTO_'] = segOrigem;
      if (!(d[COL_REGIONAL]||'').toString().trim()) {
        const r = (mapaRegionalOficial[segBase]||{})[d['_ESCOLA_']];
        if (r) d[COL_REGIONAL] = r;
      }
    });
    tag(res.fundamental,  'fundamental',  'fundamental');
    tag(res.infantil,     'infantil',     'infantil');
    tag(res.fundamental2, 'fundamental2', 'fundamental');
    tag(res.infantil2,    'infantil2',    'infantil');

    dadosPorSegmento = {
      fundamental: [...(res.fundamental||[]), ...(res.fundamental2||[])],
      infantil:    [...(res.infantil||[]),    ...(res.infantil2||[])]
    };
  } else {
    dadosPorSegmento.fundamental = Array.isArray(res) ? res : [];
    dadosPorSegmento.infantil = [];
  }
  _sincronizarAuthGlobal();

  // Porta da tela. Fica aqui, depois do MapaAuth estar pronto, para ter o
  // perfil em mãos — e antes de qualquer renderização, para não exibir nada.
  if (!podeVerRelatorios(window.MapaAuth && window.MapaAuth.perfil)) {
    telaRestrita();
    return;
  }

  // Renderiza os cards imediatamente; as devolutivas carregam em 2º plano
  // (apenas para preencher a contagem do badge) sem bloquear a tela.
  mudarSegmento('fundamental');
  carregarDevolutivas();
}

// Relatórios é restrito a SECRETARIA e SUPER ADMIN.
// Nega por padrão: perfil ausente, ou sem `tipo` definido, não entra. A regra
// de verdade está no banco (as funções relat_* fazem a mesma checagem) — isto
// aqui é só para não abrir uma tela que voltaria vazia.
function podeVerRelatorios(perfil) {
  if (!perfil) return false;
  if (perfil.is_super_admin) return true;
  return String(perfil.tipo || '').trim().toLowerCase() === 'secretaria';
}

  document.getElementById('main').innerHTML =

    + '<i class="bi bi-lock-fill fs-3 d-block mb-2"></i>'
    + '<div class="fw-bold mb-1">Tela restrita</div>'
    + '<div class="small">Relatórios está disponível apenas para perfis da secretaria. '
    + 'Se você precisa de acesso, fale com a administração da rede.</div></div>';
}

// Deriva identidade/admin do sistema global de login (auth.js / window.MapaAuth).

  const a = window.MapaAuth;

function mudarSegmento(seg) {
  segmentoAtual = seg;

  atualizarContadorSel();

  document.getElementById('filtroRegional').value = '';

    popularFiltros();

function popularFiltros() {

function popularFiltroEscola() {
  const regional = document.getElementById('filtroRegional').value;
  const base = regional ? todos.filter(d => (d[COL_REGIONAL]||'').toString().trim() === regional) : todos;
  const escolas = [...new Set(base.map(d => d['_ESCOLA_']||''))].filter(Boolean).sort();

  sel.innerHTML = '<option value="">Todas as Escolas</option>';
  escolas.forEach(e => {
    const o = document.createElement('option');

    sel.appendChild(o);
  });

function filtrar() {
  popularFiltroEscola();
  const regional = document.getElementById('filtroRegional').value;
  const escola = document.getElementById('filtroEscola').value;
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const badge = document.getElementById('badgeCount');

  // Botão de análise regional só faz sentido com uma Regional selecionada.
  const btnReg = document.getElementById('btnAnaliseRegional');
  if (btnReg) {
    btnReg.disabled = !regional;
    btnReg.title = regional ? `Analisar a regional "${regional}"` : 'Selecione uma Regional para habilitar';
  }

  filtrados = todos.filter(d => {
    if (regional && (d[COL_REGIONAL]||'').toString().trim() !== regional) return false;
    if (escola && (d['_ESCOLA_']||'') !== escola) return false;
    if (busca && !Object.values(d).some(v => v.toString().toLowerCase().includes(busca))) return false;
    return true;
  });

  selecionados.clear();
  atualizarContadorSel();
  badge.innerHTML = `<i class="bi bi-file-earmark-check-fill text-success me-1"></i> ${filtrados.length} Visita${filtrados.length!==1?'s':''}`;
  badge.style.display = 'inline-block';

  if (filtrados.length === 0) {
    mostrarEstado('Nenhum registro encontrado.', 'bi-search');
    return;
  }
  renderizarCards();
}

function renderizarCards() {
  const main = document.getElementById('main');
  const regional = document.getElementById('filtroRegional').value;
  const escola = document.getElementById('filtroEscola').value;
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const badges = `<span class="badge bg-white text-dark border shadow-sm px-3 py-2 fw-bold"><i class="bi bi-list-ol me-1 text-primary"></i> ${filtrados.length} listados</span>`;
  const statsBar = `<div class="d-flex flex-wrap gap-2 mb-4 align-items-center">${badges}</div>`;

  // Com filtro específico (regional/escola/busca): lista plana.
  const modoSimples = !!regional || !!escola || !!busca;
  if (modoSimples) {
    const cardsHtml = filtrados.map((item,idx) => _renderCard(item,idx)).join('');
    main.innerHTML = statsBar + `<div class="cards-grid">${cardsHtml}</div>`;
    return;
  }

  // Sem filtro: agrupa por regional em seções recolhíveis.
  const SEM_REGIONAL = '(Sem Regional)';
  const grupos = {};
  filtrados.forEach((item, idx) => {
    const reg = (item[COL_REGIONAL]||'').toString().trim() || SEM_REGIONAL;
    (grupos[reg] = grupos[reg] || []).push({ item, idx });
  });
  const regionais = Object.keys(grupos).sort((a,b) =>
    a===SEM_REGIONAL ? 1 : b===SEM_REGIONAL ? -1 : a.localeCompare(b));
  const umaSo = regionais.length === 1;

  const html = regionais.map(reg => {
    const itens = grupos[reg];
    const nEscolas = new Set(itens.map(({item}) => item['_ESCOLA_']).filter(Boolean)).size;
    const aberta = umaSo;
    const cards = itens.map(({item,idx}) => _renderCard(item,idx)).join('');
    return `
      <div class="regional-group">
        <div class="regional-group-header ${aberta?'':'collapsed'}" onclick="toggleRegional(this)">
          <i class="bi bi-geo-alt-fill" style="color:var(--neon-blue);font-size:1.1rem;flex-shrink:0;"></i>
          <span class="regional-group-nome">${escapar(reg)}</span>
          <span class="regional-group-meta">${nEscolas} escola${nEscolas!==1?'s':''} · ${itens.length} visita${itens.length!==1?'s':''}</span>
          <i class="bi bi-chevron-down regional-group-chevron"></i>
        </div>
        <div class="regional-group-body" style="${aberta?'':'display:none;'}">
          <div class="cards-grid">${cards}</div>
        </div>
      </div>`;
  }).join('');

  main.innerHTML = statsBar + html;
}

function toggleRegional(headerEl) {
  const group = headerEl.closest('.regional-group');
  if (!group) return;
  const body = group.querySelector('.regional-group-body');
  const aberta = !headerEl.classList.contains('collapsed');
  if (aberta) { if (body) body.style.display = 'none'; headerEl.classList.add('collapsed'); }
  else { if (body) body.style.display = 'block'; headerEl.classList.remove('collapsed'); }
}

        ${temDev?`<span class="badge" style="background:var(--neon-pink);color:#fff;font-size:0.6rem;font-weight:800;"><i class="bi bi-robot me-1"></i>Devolutiva IA</span>`:''}

// Localiza a visita correspondente a uma devolutiva (p/ abrir as duas abas).
// dadosPorSegmento só tem as chaves 'fundamental'/'infantil' (fundamental2/infantil2 são
// mescladas ali, marcadas via _SEGMENTO_), então resolve a lista pelo segmento base e
// casa pelo _SEGMENTO_ real de cada item, não pela chave da lista.
function _visitaDaDev(dev) {
  const segDev = (dev["Segmento"] || '').toLowerCase();
  const listaKey = segDev.indexOf('infantil') === 0 ? 'infantil' : 'fundamental';
  const lista = dadosPorSegmento[listaKey] || [];
  const alvo = _chaveDev(dev["Segmento"], dev["Escola"], dev["Data da Visita"]);
  return lista.find(it => _chaveDev(it['_SEGMENTO_'], it['_ESCOLA_'], it["Data da Visita:"]||it["Data da visita:"]||'') === alvo);
}

  if (c) c.classList.toggle('selecionado', selecionados.has(idx));

  const secoes = camposSecao.map(col => {
    const val = item[col]||'';
    return `<div style="border-left:4px solid #00e5ff;padding-left:12px;margin-bottom:12px;"><div style="font-size:0.75rem;font-weight:800;color:var(--primary);margin-bottom:4px;">${escapar(ROTULOS[col]||col)}</div><div>${val?escapar(val):'<span style="color:#adb5bd;font-style:italic;">Não informado</span>'}</div></div>`;
  }).join('');

  const labelSegmento = seg.startsWith('infantil') ? 'Educação Infantil' : 'Ensino Fundamental';
  const labelTipoVisita = seg.endsWith('2') ? ' · Diálogo / PPA / Boas Práticas' : '';

  return `
    <div style="border-bottom:3px solid var(--primary);padding-bottom:14px;margin-bottom:16px;">
      <div style="font-size:1.1rem;font-weight:800;color:var(--primary);">Acompanhamento Pedagógico</div>
      <div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;color:#6c757d;margin-top:4px;">${labelSegmento}${labelTipoVisita} ${anoAtual}</div>
      <div style="font-size:1rem;font-weight:800;margin-top:6px;color:#002b5e;">${escapar(escola)}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;background:#f8faff;border-radius:8px;padding:14px;margin-bottom:16px;">${fichaItens}</div>
    <div style="display:flex;flex-direction:column;gap:12px;">${secoes}</div>
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid #eee;font-size:0.75rem;color:#adb5bd;font-family:monospace;">Gerado em ${dataHoje}</div>`;
}

// ── Modal unificado: Relatório da Visita + Devolutiva (IA) ──
let _pdfHtmlRel = '', _pdfHtmlDev = '';
let _modalItem = null; // visita atualmente aberta (p/ o botão de gerar devolutiva)
let _modalDev = null, _modalDevAtiva = null; // devolutiva do modal + versão em exibição

// Seletor de versões (Gemini × Claude) — só aparece quando há mais de uma versão.
function _htmlSeletorVersoes(dev) {
  const vs = (dev && dev._versoes) || [];
  if (vs.length < 2) return '';
  const botoes = vs.map((v, i) => {
    const ativo = v === _modalDevAtiva;
    const rot = _rotuloModelo(v._modelo) || ('v' + (i + 1));
    const data = v["Salvo em"] ? ` · ${escapar(v["Salvo em"])}` : '';
    return `<button type="button" onclick="_verVersaoDev(${i})" style="border:1px solid ${ativo?'#002b5e':'#cbd5e1'};background:${ativo?'#002b5e':'#fff'};color:${ativo?'#fff':'#334155'};font-weight:800;font-size:.72rem;border-radius:999px;padding:5px 12px;cursor:pointer;">${escapar(rot)}${data}</button>`;
  }).join('');
  return `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding:10px 12px;background:#f1f5f9;border-radius:10px;">
    <span style="font-size:.7rem;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.04em;"><i class="bi bi-clock-history me-1"></i>Ver devolutivas anteriores:</span>${botoes}</div>`;
}

// Troca a versão exibida no modal (e a que vai para o PDF).
function _verVersaoDev(i) {
  if (!_modalDev || !_modalDev._versoes || !_modalDev._versoes[i]) return;
  _modalDevAtiva = _modalDev._versoes[i];
  _pdfHtmlDev = _htmlDevolutiva(_modalDevAtiva);
  const pane = document.getElementById('pane-dev');
  if (pane) pane.innerHTML = _htmlSeletorVersoes(_modalDev) + _pdfHtmlDev;
}

function abrirModal(item, dev, aba) {
  const temRel = !!item, temDev = !!dev;
  if (!temRel && !temDev) return;
  if (aba === 'dev' && !temDev) aba = 'rel';
  if (aba === 'rel' && !temRel) aba = 'dev';
  if (!aba) aba = temRel ? 'rel' : 'dev';

  _modalItem = item || null;
  _modalDev = dev || null;
  _modalDevAtiva = dev || null;   // começa na versão principal (mais recente)
  const escola = (item && item['_ESCOLA_']) || (dev && dev['Escola']) || '';
  _pdfHtmlRel = temRel ? _htmlRelatorioVisita(item) : '';
  _pdfHtmlDev = temDev ? _htmlDevolutiva(dev) : '';

  const tabs = (temRel && temDev) ? `
    <div class="modal-tabs mb-3">
      <button class="nav-link ${aba==='rel'?'active':''}" type="button" data-aba="rel" onclick="trocarAbaModal('rel')"><i class="bi bi-file-earmark-text-fill me-1"></i>Relatório da Visita</button>
      <button class="nav-link ${aba==='dev'?'active':''}" type="button" data-aba="dev" onclick="trocarAbaModal('dev')"><i class="bi bi-robot me-1"></i>Devolutiva IA</button>
    </div>` : '';

  const paneDevVazio = '<div class="estado"><i class="bi bi-robot"></i><p>Sem devolutiva salva para esta visita.</p></div>';

  document.getElementById('relatorio-container').innerHTML = `
    ${tabs}
    <div id="pane-rel" style="display:${aba==='rel'?'block':'none'};">${_pdfHtmlRel}</div>
    <div id="pane-dev" style="display:${aba==='dev'?'block':'none'};">${temDev ? (_htmlSeletorVersoes(dev) + _pdfHtmlDev) : paneDevVazio}</div>`;

  document.getElementById('modalTitulo').textContent = escola;

  const optRel = temRel ? `<label class="pdf-opt"><input type="checkbox" id="pdfRel" checked> Relatório</label>` : '';
  const optDev = temDev ? `<label class="pdf-opt"><input type="checkbox" id="pdfDev" checked> Devolutiva</label>` : '';
  // Geração de devolutivas saiu da tela (agora é feita fora do app); o modal fica só
  // para leitura/impressão.
  const btnIA = '';
  document.getElementById('modalRelatorioFooter').innerHTML = `
    <div class="d-flex align-items-center justify-content-between w-100 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <span style="font-size:.72rem;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.04em;"><i class="bi bi-filetype-pdf me-1"></i>Incluir no PDF:</span>
        ${optRel}${optDev}
      </div>
      <div class="d-flex align-items-center gap-2 flex-wrap">
        ${btnIA}
        <button class="btn btn-action btn-action-primary" onclick="gerarPdf()"><i class="bi bi-printer-fill me-1"></i>Imprimir / PDF</button>
      </div>
    </div>`;

  bootstrap.Modal.getOrCreateInstance(document.getElementById('modalRelatorio')).show();
}

function trocarAbaModal(aba) {
  const r = document.getElementById('pane-rel'), d = document.getElementById('pane-dev');
  if (r) r.style.display = aba==='rel' ? 'block' : 'none';
  if (d) d.style.display = aba==='dev' ? 'block' : 'none';
  document.querySelectorAll('.modal-tabs .nav-link').forEach(b => b.classList.toggle('active', b.dataset.aba === aba));
}

function _pdfCabecalho(subtitulo) {
  const dataHoje = new Date().toLocaleDateString('pt-BR');
  return `<div class="pdf-cab">
    <div class="pdf-cab-marca"><i class="bi bi-map-fill"></i>MAPA <span>· SME RIBEIRÃO PRETO</span></div>
    <div class="pdf-cab-sub">${subtitulo}</div>
    <div class="pdf-cab-data">Gerado em ${dataHoje}</div>
  </div>`;
}

function _pdfRodape() {
  return `<div class="pdf-rodape">
    <span>MAPA · Secretaria Municipal da Educação de Ribeirão Preto</span>
    <span>Acompanhamento Pedagógico</span>
  </div>`;
}

function gerarPdf() {
  const incRel = !!document.getElementById('pdfRel') && document.getElementById('pdfRel').checked;
  const incDev = !!document.getElementById('pdfDev') && document.getElementById('pdfDev').checked;
  if (!incRel && !incDev) { mostrarToast('Selecione ao menos uma seção para o PDF.'); return; }
  let html = '';
  if (incRel && _pdfHtmlRel) html += `<section class="pdf-sec">${_pdfCabecalho('Relatório de Acompanhamento Pedagógico')}${_pdfHtmlRel}${_pdfRodape()}</section>`;
  if (incDev && _pdfHtmlDev) html += `<section class="pdf-sec">${_pdfCabecalho('Devolutiva Pedagógica (IA)')}${_pdfHtmlDev}${_pdfRodape()}</section>`;
  document.getElementById('print-area').innerHTML = html;
  window.print();
}

// Abertura a partir dos cards de visita (Fundamental/Infantil)
function abrirRelatorio(idx) {
  const item = filtrados[idx];
  abrirModal(item, _devDoItem(item), 'rel');
}

// (Login próprio removido — a autenticação é feita pelo sistema global auth.js/MapaAuth.)

// ── Devolutivas ──
function carregarDevolutivas(cb, forcar) {
  // Já em memória: renderiza na hora, sem nova requisição à API.
  if (devolutivasCarregadas && !forcar) {
    if (secaoAtual === 'devolutivas') { popularFiltrosDevolutivas(); filtrarDevolutivas(); }
    if (cb) cb();
    return;
  }

  // Só mostra o spinner quando a aba Devolutivas está ativa; em carga inicial
  // esta função roda em segundo plano e não deve sobrescrever o main.
  if (secaoAtual === 'devolutivas') {
    const main = document.getElementById('main');
    main.innerHTML = '<div class="spinner-wrapper"><div class="spinner-border text-primary" role="status"></div></div>';
  }

  const onSucesso = res => {
    if (!res || !res.ok) {
      if (secaoAtual === 'devolutivas') {
        document.getElementById('main').innerHTML = `<div class="alert alert-danger fw-bold">Erro: ${escapar((res && res.erro) || 'falha ao carregar devolutivas')}</div>`;
      }
      if (cb) cb();
      return;
    }
    todasDevolutivas = res.registros || [];
    devolutivasCarregadas = true;
    _construirMapaDevolutivas();
    const n = todasDevolutivas.filter(d => d._versoes).length;   // visitas com devolutiva (não conta versões repetidas)
    const b = document.getElementById('badge-dev');
    if (b) { b.textContent = n; b.style.display = n > 0 ? 'inline-flex' : 'none'; }
    if (secaoAtual === 'devolutivas') {
      popularFiltrosDevolutivas();
      filtrarDevolutivas();
    } else if (filtrados.length) {
      // Atualiza os cards de visita para exibir os selos de devolutiva
      renderizarCards();
    }
    if (cb) cb();
  };

  if (FONTE_DADOS === 'supabase' && window.MAPA_SB) {
    // Origem Supabase (RLS filtra por escola no servidor)
    _lerDevolutivasSupabase()
      .then(onSucesso)
      .catch(err => { console.error('Falha ao ler devolutivas do Supabase:', err); onSucesso({ ok: true, registros: [] }); });
  } else if (typeof google !== 'undefined' && google.script) {
    // Modo Google Apps Script
    google.script.run.withSuccessHandler(onSucesso).lerDevolutivas();
  } else {
    // Modo externo: API ou fallback silencioso (sem devolutivas)
    chamarAPI('lerDevolutivas')
      .then(onSucesso)
      .catch(() => onSucesso({ ok: true, registros: [] }));
  }
}

// Resolve a regional de uma devolutiva (campo direto ou via mapa oficial da escola)
function _regionalDaDev(dev) {
  if (dev["Regional"] && dev["Regional"] !== 'REDE') return dev["Regional"];
  const escola = dev["Escola"] || '';
  const segDev = (dev["Segmento"] || '').toLowerCase();
  const segKey = segDev.includes('fundamental') ? 'fundamental' : segDev.includes('infantil') ? 'infantil' : null;
  if (segKey) { const r = (mapaRegionalOficial[segKey] || {})[escola] || ''; if (r) return r; }
  for (const s of ['fundamental', 'infantil']) { const r = (mapaRegionalOficial[s] || {})[escola] || ''; if (r) return r; }
  return '';
}

// Rótulo amigável do segmento
function _rotuloSegmento(s) {
  const v = (s || '').toLowerCase();
  if (v.includes('fundamental')) return 'Fundamental';
  if (v.includes('infantil')) return 'Infantil';
  return s || '';
}

// Badge compacto colorido por nível (prioridade/risco) para os cards
function _badgeMini(icone, valor) {
  if (!valor) return '';
  const v = valor.toLowerCase();
  let bg = '#e2e8f0', fg = '#475569';
  if (/alt|crít|crit/.test(v))      { bg = '#fee2e2'; fg = '#b91c1c'; }
  else if (/m[éeè]d/.test(v))       { bg = '#fef3c7'; fg = '#92400e'; }
  else if (/baix/.test(v))          { bg = '#d1fae5'; fg = '#047857'; }
  return `<span style="background:${bg};color:${fg};font-weight:800;font-size:.62rem;padding:2px 8px;border-radius:999px;"><i class="bi ${icone} me-1"></i>${escapar(valor)}</span>`;
}

function popularFiltrosDevolutivas() {
  // Segmento
  const selSeg = document.getElementById('filtroDevSegmento');
  const segAtual = selSeg.value;
  const segmentos = [...new Set(todasDevolutivas.map(d => d["Segmento"]).filter(Boolean))].sort();
  selSeg.innerHTML = '<option value="">Todos os Segmentos</option>' +
    segmentos.map(s => `<option value="${escapar(s)}">${escapar(_rotuloSegmento(s))}</option>`).join('');
  selSeg.value = segmentos.includes(segAtual) ? segAtual : '';

  // Regional (resolvida pela escola)
  const selReg = document.getElementById('filtroDevRegional');
  const regAtual = selReg.value;
  const regionaisSet = new Set();
  todasDevolutivas.forEach(d => { const r = _regionalDaDev(d); if (r) regionaisSet.add(r); });
  const regionais = [...regionaisSet].sort();
  selReg.innerHTML = '<option value="">Todas as Regionais</option>' +
    regionais.map(r => `<option value="${escapar(r)}">${escapar(r)}</option>`).join('');
  selReg.value = regionais.includes(regAtual) ? regAtual : '';
}

function filtrarDevolutivas() {
  const tipoFil = (document.getElementById('filtroDevTipo')||{}).value || '';
  const seg    = document.getElementById('filtroDevSegmento').value;
  const regFil = document.getElementById('filtroDevRegional').value;
  const prio   = document.getElementById('filtroDevPrioridade').value;
  const busca  = document.getElementById('buscaDev').value.trim().toLowerCase();

  // 'rede' agrupa síntese de rede global e rede por seleção manual.
  const tipoDaDev = d => d._tipo === 'regional' ? 'regional'
                    : (d._tipo === 'sintese_global' || d._tipo === 'rede') ? 'rede'
                    : 'individual';

  devolutivasFiltradas = todasDevolutivas.filter(d => {
    if (!d._versoes) return false;   // 1 card por visita (a versão mais recente); as demais ficam no seletor
    if (tipoFil && tipoDaDev(d) !== tipoFil) return false;
    if (seg    && d["Segmento"] !== seg) return false;
    if (regFil && _regionalDaDev(d) !== regFil) return false;
    if (prio   && ((d._dados||{}).prioridade||'').toLowerCase() !== prio.toLowerCase()) return false;
    if (busca) {
      const alvo = [d["Escola"], d["Data da Visita"], _regionalDaDev(d), _rotuloSegmento(d["Segmento"])].join(' ').toLowerCase();
      if (!alvo.includes(busca)) return false;
    }
    return true;
  });

  renderizarDevolutivas();
}

function renderizarDevolutivas() {
  const main = document.getElementById('main');
  if (devolutivasFiltradas.length === 0) { mostrarEstado('Nenhuma devolutiva encontrada.', 'bi-robot'); return; }

  // Agrupa por tipo, preservando o índice original de devolutivasFiltradas (usado no onclick).
  const grupos = { individual: [], regional: [], rede: [] };
  devolutivasFiltradas.forEach((dev, i) => {
    const k = dev._tipo === 'regional' ? 'regional'
            : (dev._tipo === 'sintese_global' || dev._tipo === 'rede') ? 'rede'
            : 'individual';
    grupos[k].push({ dev, i });
  });

  const secoes = [
    { key: 'individual', titulo: 'Devolutivas Individuais', icone: 'bi-file-earmark-text-fill' },
    { key: 'regional',   titulo: 'Devolutivas Regionais',   icone: 'bi-diagram-3-fill' },
    { key: 'rede',       titulo: 'Síntese de Rede',         icone: 'bi-stars' }
  ];

  const n = devolutivasFiltradas.length;
  const stats = `<div class="d-flex flex-wrap gap-2 mb-4 align-items-center">
    <span class="badge bg-white text-dark border shadow-sm px-3 py-2 fw-bold"><i class="bi bi-robot me-1 text-primary"></i> ${n} devolutiva${n!==1?'s':''}</span>
  </div>`;

  const html = secoes.filter(s => grupos[s.key].length).map(s => {
    const cards = grupos[s.key].map(o => renderCardDevolutiva(o.dev, o.i)).join('');
    return `
      <div class="d-flex align-items-center gap-2 mb-2 mt-3" style="font-weight:900;color:var(--primary);font-size:1rem;">
        <i class="bi ${s.icone}"></i> ${s.titulo}
        <span class="badge bg-light text-dark border fw-bold" style="font-size:.7rem;">${grupos[s.key].length}</span>
      </div>
      <div class="cards-grid mb-2">${cards}</div>`;
  }).join('');

  main.innerHTML = stats + html;
}

function renderCardDevolutiva(dev, i) {
  const d = dev._dados || {};
  const risco = d.risco_pedagogico || {};
  const reg = _regionalDaDev(dev);
  const t = _tipoDev(dev);
  const ehRede = dev._tipo === 'rede' || dev._tipo === 'regional' || dev._tipo === 'sintese_global';
  const titulo = ehRede ? _tituloDevRede(dev) : (dev["Escola"] || '—');
  const sintese = d.sintese_executiva || d.panorama_geral
    || (d.pontos_fortes && d.pontos_fortes[0]) || (d.pontos_fortes_rede && d.pontos_fortes_rede[0]) || '';
  const idDev = escapar(dev["ID"] || '');
  const chipTipo = `<span class="badge" style="background:${t.bg};color:${t.fg};font-size:0.58rem;font-weight:800;flex-shrink:0;"><i class="bi ${t.ic} me-1"></i>${t.txt}</span>`;
  const meta = [];
  if (d.quantidade_escolas) meta.push(`${escapar(d.quantidade_escolas)} esc.`);
  if (d.quantidade_visitas) meta.push(`${escapar(d.quantidade_visitas)} vis.`);

  // Selo de versões (Gemini × Claude) quando a mesma visita tem mais de uma.
  const versoes = (dev._versoes || []);
  const chipVersoes = versoes.length > 1
    ? `<div class="mt-2" style="font-size:.62rem;font-weight:700;color:#64748b;"><i class="bi bi-clock-history me-1"></i>Ver devolutivas anteriores</div>`
    : '';

  return `
    <div class="card-kpi rel-card" onclick="abrirDevolutivaIdx(${i})">
      <div class="d-flex justify-content-between align-items-start gap-2 border-bottom pb-2 mb-2">
        <div class="card-title-escola">${escapar(titulo)}</div>
        ${chipTipo}
      </div>
      <div class="card-meta-info mb-2 d-flex flex-wrap gap-2 align-items-center">
        <span><i class="bi bi-calendar3 me-1"></i>${escapar(dev["Data da Visita"]||'—')}</span>
        ${(reg && !ehRede)?`<span class="badge bg-light text-primary border" style="font-size:0.6rem;font-weight:800;"><i class="bi bi-geo-alt me-1"></i>${escapar(reg)}</span>`:''}
        ${meta.length?`<span class="badge bg-light text-dark border" style="font-size:0.6rem;font-weight:700;">${meta.join(' · ')}</span>`:''}
      </div>
      ${sintese?`<div style="font-size:0.78rem;color:#495057;line-height:1.4;flex-grow:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;">${escapar(sintese)}</div>`:'<div style="flex-grow:1;"></div>'}
      ${(d.prioridade||risco.nivel)?`<div class="d-flex flex-wrap gap-1 mt-2">${_badgeMini('bi-flag-fill',d.prioridade)}${_badgeMini('bi-shield-exclamation',risco.nivel)}</div>`:''}
      ${chipVersoes}
      <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
        <span style="font-size:0.7rem;color:#adb5bd;font-family:monospace;">Salvo em ${escapar(dev["Salvo em"]||'—')}</span>
        ${(isAdmin&&idDev)?`<button class="btn btn-sm py-0 px-2" style="font-size:0.7rem;color:#dc3545;border:1px solid #dc3545;border-radius:6px;" title="Excluir devolutiva" onclick="excluirDevolutiva(event,'${idDev}')"><i class="bi bi-trash3"></i></button>`:''}
      </div>
    </div>`;
}

// Abertura a partir dos cards da aba Devolutivas (por índice da lista filtrada)
function abrirDevolutivaIdx(i) {
  const dev = devolutivasFiltradas[i];
  if (dev) abrirModal(_visitaDaDev(dev), dev, 'dev');
}

// Exclusão (apenas admin; backend roda como dono do script)
function excluirDevolutiva(event, id) {
  event.stopPropagation();
  if (!id) return;
  if (!confirm('Excluir esta devolutiva permanentemente?')) return;
  const onOk = res => {
    if (res && res.ok) {
      mostrarToast('Devolutiva excluída.');
      devolutivasCarregadas = false;
      carregarDevolutivas(null, true);
    } else {
      mostrarToast('Erro ao excluir: ' + ((res && res.erro) || ''));
    }
  };
  if (typeof google !== 'undefined' && google.script) {
    google.script.run.withSuccessHandler(onOk).withFailureHandler(() => mostrarToast('Falha ao excluir.')).excluirDevolutiva(id);
  } else {
    chamarAPI('excluirDevolutiva', { id }).then(onOk).catch(() => mostrarToast('Falha ao excluir.'));
  }
}

function _badgeNivel(valor) {
  const v = (valor||'').toLowerCase();
  let bg = '#e2e8f0', fg = '#475569';
  if (/alt|crít|crit/.test(v))      { bg = '#fee2e2'; fg = '#b91c1c'; }
  else if (/m[éeè]d/.test(v))       { bg = '#fef3c7'; fg = '#92400e'; }
  else if (/baix/.test(v))          { bg = '#d1fae5'; fg = '#047857'; }
  return `<span style="background:${bg};color:${fg};font-weight:800;font-size:.68rem;padding:3px 10px;border-radius:999px;">${escapar(valor||'—')}</span>`;
}

// Converte um item de lista em texto. Aceita string ou objeto (prioridades,
// boas práticas, disparidades) vindos das análises de rede/regional/síntese.
function _itemTexto(x) {
  if (x == null) return '';
  if (typeof x === 'string') return x;
  if (typeof x === 'object') {
    if (x.prioridade) return `${x.prioridade}${x.nivel?` (${x.nivel})`:''}${x.justificativa?` — ${x.justificativa}`:''}${Array.isArray(x.regionais_impactadas)&&x.regionais_impactadas.length?` [${x.regionais_impactadas.join(', ')}]`:''}`;
    if (x.pratica) return `${x.pratica}${x.regional_origem?` (origem: ${x.regional_origem})`:''}${x.como_replicar?` — replicar: ${x.como_replicar}`:''}${x.impacto_esperado?` — impacto: ${x.impacto_esperado}`:''}`;
    if (x.desafio_unico) return `${x.regional?x.regional+': ':''}${x.desafio_unico}${x.oportunidade?` — oportunidade: ${x.oportunidade}`:''}`;
    return JSON.stringify(x);
  }
  return String(x);
}

function _secLista(titulo, icone, cor, itens) {
  if (!itens || !itens.length) return '';
  const lis = itens.map(t => `<li style="margin-bottom:5px;">${escapar(_itemTexto(t))}</li>`).join('');
  return `<div style="margin-bottom:16px;">
    <div style="font-size:.8rem;font-weight:800;color:${cor};margin-bottom:6px;"><i class="bi ${icone} me-1"></i>${titulo}</div>
    <ul style="margin:0;padding-left:20px;font-size:.88rem;color:#334155;line-height:1.45;">${lis}</ul>
  </div>`;
}

function _secTexto(titulo, icone, cor, texto) {
  if (!texto) return '';
  return `<div style="margin-bottom:16px;">
    <div style="font-size:.8rem;font-weight:800;color:${cor};margin-bottom:6px;"><i class="bi ${icone} me-1"></i>${titulo}</div>
    <div style="font-size:.88rem;color:#334155;line-height:1.5;">${escapar(texto)}</div>
  </div>`;
}

// Rótulo/estilo do tipo de devolutiva (individual x rede x regional x síntese)
function _tipoDev(dev) {
  switch (dev && dev._tipo) {
    case 'regional':       return { txt:'Regional',      ic:'bi-diagram-3-fill', bg:'#ede9fe', fg:'#6d28d9' };
    case 'rede':           return { txt:'Rede',          ic:'bi-diagram-2-fill', bg:'#e0f2fe', fg:'#0369a1' };
    case 'sintese_global': return { txt:'Síntese Rede',  ic:'bi-globe',          bg:'#dcfce7', fg:'#15803d' };
    default:               return { txt:'Individual',    ic:'bi-file-earmark-text', bg:'#f1f5f9', fg:'#475569' };
  }
}

// Título curto e legível para cards/modais de rede/regional/síntese

// ════════════════════════════════════════════════
//  Disparo de Análises por IA (Gemini via Apps Script)
// ════════════════════════════════════════════════
let _analisando = false;
let _falhasLote = []; // itens que falharam no último lote (p/ "repetir falhas")

function _setBtnLoading(btn, loading, textoLoading) {
  if (!btn) return;
  if (loading) {
    if (btn.dataset._idle === undefined) btn.dataset._idle = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> ${textoLoading || 'Analisando…'}`;
  } else {
    btn.disabled = false;
    if (btn.dataset._idle !== undefined) { btn.innerHTML = btn.dataset._idle; delete btn.dataset._idle; }
  }
}

// ── Banner de progresso da IA (feedback global: a IA leva ~10–40s) ──
// opts: { texto, spinner:bool, acoes:[{id,label,onclick}] }
function _iaBanner(opts) {
  let el = document.getElementById('ia-progress');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ia-progress';
    el.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:4000;'
      + 'background:#002b5e;color:#fff;font:700 13px/1.35 Inter,system-ui,sans-serif;padding:11px 16px;'
      + 'border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.28);display:flex;align-items:center;gap:12px;max-width:92vw;';
    document.body.appendChild(el);
  }
  const spin = opts.spinner ? '<span class="spinner-border spinner-border-sm" style="flex-shrink:0"></span>' : '';
  const acoes = (opts.acoes || []).map(a =>
    `<button type="button" data-act="${a.id}" style="border:0;background:#fff;color:#002b5e;font-weight:800;border-radius:999px;padding:4px 12px;cursor:pointer;flex-shrink:0;">${a.label}</button>`
  ).join('');
  el.innerHTML = `${spin}<span style="min-width:0;">${opts.texto}</span>${acoes}`;
  (opts.acoes || []).forEach(a => { const b = el.querySelector(`[data-act="${a.id}"]`); if (b) b.onclick = a.onclick; });
  el.style.display = 'flex';
}
function _iaBannerHide() { const el = document.getElementById('ia-progress'); if (el) el.style.display = 'none'; }

// Leva o usuário até a devolutiva recém-gerada: vai para a aba Devolutivas e a abre.
function _abrirDevolutivaPorId(id) {
  if (!id) return;
  const dev = (todasDevolutivas || []).find(d => (d["ID"] || '') === id);
  if (!dev) { if (secaoAtual !== 'devolutivas') mudarSecao('devolutivas'); return; }
  if (secaoAtual !== 'devolutivas') mudarSecao('devolutivas');
  abrirModal(_visitaDaDev(dev), dev, 'dev');
}

// Gera (ou regenera) a devolutiva individual de UMA visita → Promise.
// A visita é enviada inteira (inclui _SEGMENTO_, usado pelo backend p/ escolher o prompt).
function _gerarDevolutivaVisita(item) {
  const seg = item['_SEGMENTO_'] || segmentoAtual;
  const escola = item['_ESCOLA_'] || '';
  const dataVisita = item['Data da Visita:'] || item['Data da visita:'] || item['Carimbo de data/hora'] || '';
  return _chamarBackend('analisarVisitaComGemini', item, 'analisar', { dados: JSON.stringify(item) })
    .then(res => {
      if (!res || !res.ok) throw new Error((res && res.erro) || 'Falha na análise');
      const payload = { segmento: seg, escola: escola, dataVisita: dataVisita, dados: res.dados };
      return _chamarBackend('salvarDevolutiva', payload, 'salvarDevolutiva', { payload: JSON.stringify(payload) });
    })
    .then(res => {
      if (!res || !res.ok) throw new Error((res && res.erro) || 'Falha ao salvar');
      return res;
    });
}

// Botão dentro do modal da visita: gera/regenera a devolutiva daquela visita.
function analisarVisitaAtual(btn) {
  if (_analisando || !_modalItem) return;
  const item = _modalItem;
  _analisando = true;
  _setBtnLoading(btn, true);
  _iaBanner({ texto: 'Gerando devolutiva com IA… pode levar até ~30s.', spinner: true });
  _gerarDevolutivaVisita(item)
    .then(() => {
      devolutivasCarregadas = false;
      carregarDevolutivas(() => {
        _iaBannerHide();
        mostrarToast('Devolutiva gerada!');
        abrirModal(item, _devDoItem(item), 'dev'); // reabre já mostrando o resultado
      }, true);
    })
    .catch(err => { _iaBannerHide(); mostrarToast('Erro: ' + (err.message || err)); _setBtnLoading(btn, false); })
    .finally(() => { _analisando = false; });
}

// Devolutiva "desatualizada": a visita tem alguma data (data da visita ou carimbo do
// formulário) POSTERIOR à data em que a análise foi salva ("Salvo em"). Ou seja, a visita
// mudou/foi (re)enviada depois da análise — nesse caso a devolutiva NÃO deve ser pulada
// no lote, e sim regerada.
function _devDesatualizada(item, dev) {
  const salvoEm = _parseData(dev && dev["Salvo em"]);
  if (!salvoEm) return false; // sem data de análise → não força regeração
  const cands = [
    _parseData(item["Data da Visita:"] || item["Data da visita:"]),
    _parseData(item["Carimbo de data/hora"])
  ].filter(Boolean).map(d => d.getTime());
  if (!cands.length) return false;
  return Math.max.apply(null, cands) > salvoEm.getTime();
}

// Uma visita precisa de análise no lote se não tem devolutiva OU a devolutiva está
// desatualizada (visita com data posterior à data da análise).
function _precisaAnalise(item) {
  const dev = _devDoItem(item);
  return !dev || _devDesatualizada(item, dev);
}

// Botão da barra lateral: gera devolutivas individuais para as visitas selecionadas
// (uma a uma, em sequência). "Lote inteligente": pula as que já têm devolutiva ATUALIZADA;
// regera as que não têm devolutiva ou cuja visita mudou depois da análise.
function analisarLote() {
  if (_analisando) return;
  const alvos = [...selecionados].map(i => filtrados[i]).filter(Boolean);
  if (alvos.length === 0) return;
  const aGerar = alvos.filter(_precisaAnalise);
  const pulados = alvos.length - aGerar.length;

  let fila;
  if (aGerar.length === 0) {
    // Todas já têm devolutiva atualizada → só faz sentido regerar (com confirmação explícita).
    if (!confirm(`Todas as ${alvos.length} visita(s) selecionada(s) já têm devolutiva atualizada.\nRegerar todas mesmo assim?`)) return;
    fila = alvos;
  } else {
    const msg = pulados > 0
      ? `Gerar devolutiva por IA para ${aGerar.length} visita(s).\n(${pulados} já têm devolutiva atualizada e serão puladas.)`
      : `Gerar devolutiva por IA para ${aGerar.length} visita(s) selecionada(s)?`;
    if (!confirm(msg)) return;
    fila = aGerar;
  }
  _processarLote(fila);
}

// Processa uma fila de visitas em sequência, com progresso e relatório de falhas.
function _processarLote(fila) {
  _analisando = true;
  _falhasLote = [];
  const btn = document.getElementById('btnAnalisarLote');
  _setBtnLoading(btn, true, '0/' + fila.length + '…');
  let ok = 0, i = 0;
  const falhas = [];
  const proximo = () => {
    if (i >= fila.length) {
      devolutivasCarregadas = false;
      carregarDevolutivas(null, true);
      _analisando = false; _setBtnLoading(btn, false);
      _falhasLote = falhas.map(f => f.item);
      if (falhas.length) {
        const nomes = falhas.slice(0, 3).map(f => f.item['_ESCOLA_'] || '?').join(', ');
        _iaBanner({
          texto: `<b>${ok}</b> gerada(s), <b>${falhas.length}</b> falha(s)${nomes ? ` (${escapar(nomes)}${falhas.length > 3 ? '…' : ''})` : ''}.`,
          acoes: [
            { id: 'retry', label: `Repetir ${falhas.length}`, onclick: repetirFalhasLote },
            { id: 'close', label: 'Fechar', onclick: _iaBannerHide }
          ]
        });
      } else {
        _iaBannerHide();
        mostrarToast(`${ok} devolutiva(s) gerada(s).`);
      }
      return;
    }
    const item = fila[i++];
    _iaBanner({ texto: `Gerando devolutivas com IA… <b>${i}/${fila.length}</b>`, spinner: true });
    if (btn) btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> ${i}/${fila.length}…`;
    _gerarDevolutivaVisita(item).then(() => ok++).catch(err => falhas.push({ item, erro: (err && err.message) || String(err) })).finally(proximo);
  };
  proximo();
}

// Reexecuta apenas as visitas que falharam no último lote.
function repetirFalhasLote() {
  if (_analisando || !_falhasLote.length) return;
  _processarLote(_falhasLote.slice());
}

// Botão da barra lateral: análise consolidada de uma Regional (junta os 2 formulários).
function analisarRegionalAtual(btn) {
  if (_analisando) return;
  const regional = document.getElementById('filtroRegional').value;
  if (!regional) { mostrarToast('Selecione uma Regional no filtro ao lado.'); return; }
  const seg = segmentoAtual; // base (fundamental|infantil); a lista já junta os 2 tipos
  const visitasReg = (dadosPorSegmento[seg] || []).filter(v => (v[COL_REGIONAL] || '').toString().trim() === regional);
  const escolas = [...new Set(visitasReg.map(v => v['_ESCOLA_']).filter(Boolean))].sort();
  if (!escolas.length) { mostrarToast('Sem visitas nessa regional.'); return; }
  if (!confirm(`Gerar análise regional de "${regional}"?\n${escolas.length} escola(s), ${visitasReg.length} visita(s) — juntando os 2 formulários.`)) return;
  _analisando = true;
  _setBtnLoading(btn, true);
  _iaBanner({ texto: `Gerando análise da regional "${escapar(regional)}"… juntando ${visitasReg.length} visita(s), pode levar mais de 30s.`, spinner: true });
  const reqPayload = { segmento: seg, regional: regional };
  _chamarBackend('analisarRegionalComGemini', reqPayload, 'analisarRegional', { payload: JSON.stringify(reqPayload) })
    .then(res => {
      if (!res || !res.ok) throw new Error((res && res.erro) || 'Falha na análise regional');
      const salvar = { segmento: seg, regional: regional, escolas: escolas, dataGeracao: _hojeBR(), dados: res.dados };
      return _chamarBackend('salvarDevolutivaRegional', salvar, 'salvarDevolutivaRegional', { payload: JSON.stringify(salvar) });
    })
    .then(res => {
      if (!res || !res.ok) throw new Error((res && res.erro) || 'Falha ao salvar');
      const novoId = res.id;
      devolutivasCarregadas = false;
      carregarDevolutivas(() => {
        _iaBannerHide();
        mostrarToast('Análise regional gerada!');
        _abrirDevolutivaPorId(novoId); // leva o usuário direto ao resultado
      }, true);
    })
    .catch(err => { _iaBannerHide(); mostrarToast('Erro: ' + (err.message || err)); })
    .finally(() => { _analisando = false; _setBtnLoading(btn, false); });
}

// Botão da aba Devolutivas: síntese de rede a partir das análises regionais já salvas.
function sintetizarRedeGlobal(btn) {
  if (_analisando) return;
  const selSeg = document.getElementById('filtroSinteseSegmento');
  const seg = (selSeg && selSeg.value) || 'fundamental';
  if (!confirm(`Sintetizar a rede de "${seg === 'infantil' ? 'Educação Infantil' : 'Ensino Fundamental'}" a partir das análises regionais já salvas?`)) return;
  _analisando = true;
  _setBtnLoading(btn, true);
