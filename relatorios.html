    .then(res => {
      if (!res || !res.ok) throw new Error((res && res.erro) || 'Falha na síntese');
      const salvar = { segmento: seg, dataGeracao: _hojeBR(), dados: res.dados };
      return _chamarBackend('salvarSinteseRedeGlobal', salvar, 'salvarSinteseRedeGlobal', { payload: JSON.stringify(salvar) });
    })
    .then(res => {
      if (!res || !res.ok) throw new Error((res && res.erro) || 'Falha ao salvar');
      const novoId = res.id;
      devolutivasCarregadas = false;
      carregarDevolutivas(() => {
        _iaBannerHide();
        mostrarToast('Síntese de rede gerada!');
        _abrirDevolutivaPorId(novoId);
      }, true);
    })
    .catch(err => { _iaBannerHide(); mostrarToast('Erro: ' + (err.message || err)); })
    .finally(() => { _analisando = false; _setBtnLoading(btn, false); });
}

// ════════════════════════════════════════════════
//  Estatísticas / Cobertura de Visitas
// ════════════════════════════════════════════════
let chartCobertura = null;
let _coberturaCompleta = [];
let filtroAtivo = null; // null | {tipo:'freq', valor:N} | {tipo:'dev'}
let _estFreqs = [];
let ordemCob = { campo: 'escola', asc: true };

const PALETA_FREQ = ['#002b5e','#39c46e','#FFD300','#FF007F','#00b4d8','#6f42c1','#fd7e14'];
function _corFreq(f) { return f === 0 ? '#dc3545' : PALETA_FREQ[(f-1) % PALETA_FREQ.length]; }
function _rotuloFreq(f) { return f === 0 ? 'Sem visita' : f + (f === 1 ? ' visita' : ' visitas'); }
function _rotuloFiltro() {
  const f = filtroAtivo;
  if (!f) return '';
  if (f.tipo === 'dev')      return 'Com devolutiva';
  if (f.tipo === 'pendente') return 'Devolutiva pendente';
  if (f.tipo === 'risco')    return 'Risco ' + (_ROT_RISCO[f.valor] || f.valor).toLowerCase();
  if (f.tipo === 'tema')     return 'Tema: ' + ((_TEMAS.find(t => t.key === f.valor) || {}).lbl || f.valor);
  if (f.tipo === 'idade')    return ({ d30:'Última visita ≤30 dias', d60:'Última visita 31–60 dias', d90:'Última visita 61–90 dias', mais:'Última visita +90 dias' })[f.valor] || '';
  return _rotuloFreq(f.valor);
}

function _parseData(str) {
  if (!str) return null;
  const m = String(str).match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  if (!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0));
}
function _fmtData(d) {
  if (!d) return '—';
  return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();
}

// Monta a cobertura (1 linha por escola oficial) dos segmentos selecionados
function _construirCobertura(segs) {
  const linhas = [];
  segs.forEach(seg => {
    const oficiais = escolasOficiais[seg] || [];
    const mapaReg  = mapaRegionalOficial[seg] || {};
    const visitas  = dadosPorSegmento[seg] || [];
    const porEscola = {};
    visitas.forEach(v => {
      const e = (v['_ESCOLA_']||'').toString().trim();
      if (!e) return;
      (porEscola[e] = porEscola[e] || []).push(v);
    });
    const universo = oficiais.length ? oficiais : Object.keys(porEscola);
    universo.forEach(escola => {
      const vs = porEscola[escola] || [];
      const datas = vs.map(v => _parseData(v['Data da Visita:']||v['Data da visita:']||v['Carimbo de data/hora'])).filter(Boolean);
      const ultima = datas.length ? new Date(Math.max(...datas.map(d=>d.getTime()))) : null;
      const reg = mapaReg[escola] || (vs[0] && (vs[0][COL_REGIONAL]||'').toString().trim()) || '—';
      // devolutiva individual mais recente da escola → risco / prioridade / temas
      let devDados = null, devTs = -Infinity;
      vs.forEach(v => {
        const dv = mapaDevolutivas.get(_chaveDev(v['_SEGMENTO_']||seg, escola, v['Data da Visita:']||v['Data da visita:']||''));
        if (dv && (!dv._tipo || dv._tipo === 'individual')) {
          const t = _tsDev(dv);
          if (t >= devTs) { devTs = t; devDados = dv._dados || {}; }
        }
      });
      linhas.push({
        escola, regional: reg, segKey: seg, segmento: seg==='fundamental'?'Fundamental':'Infantil',
        nVisitas: vs.length, datas, ultima, temDev: !!devDados,
        dev: devDados,
        risco: (devDados && (devDados.risco_pedagogico||{}).nivel) || '',
        prioridade: (devDados && devDados.prioridade) || ''
      });
    });
  });
  return linhas;
}

// ════════════════════════════════════════════════
//  Painéis analíticos (novos): cobertura por regional, risco pedagógico,
//  temas recorrentes, evolução temporal, envelhecimento e backlog de devolutivas.
//  Todos operam sobre _coberturaCompleta (conjunto já filtrado por segmento/regional/busca).
// ════════════════════════════════════════════════
const _MESES_AB = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
let chartTemporal = null;

// Nível de risco pedagógico normalizado a partir da devolutiva individual mais recente
function _nivelRisco(l) {
  if (!l.dev) return 'sem';
  const n = String(l.risco||'').toLowerCase();
  if (n.includes('alt'))  return 'alto';
  if (n.includes('méd') || n.includes('med')) return 'medio';
  if (n.includes('baix')) return 'baixo';
  return 'sem';
}
const _ROT_RISCO = { alto:'Alto', medio:'Médio', baixo:'Baixo', sem:'Sem análise' };
const _COR_RISCO = { alto:'#ef4444', medio:'#f59e0b', baixo:'#10b981', sem:'#94a3b8' };
function _pillRisco(l) {
  const n = _nivelRisco(l);
  if (n === 'sem') return '<span class="text-muted">—</span>';
  return `<span class="pill pill-risco-${n}">${_ROT_RISCO[n]}</span>`;
}

// A) Cobertura por Regional ─────────────────────────────────────────────
function _painelCoberturaRegional() {
  const porReg = {};
  _coberturaCompleta.forEach(l => {
    const r = (l.regional && l.regional !== '—') ? l.regional : 'Sem regional';
    const o = porReg[r] || (porReg[r] = { total:0, visitadas:0 });
    o.total++; if (l.nVisitas > 0) o.visitadas++;
  });
  const linhas = Object.entries(porReg)
    .map(([reg,o]) => ({ reg, ...o, pct: o.total ? Math.round(o.visitadas/o.total*100) : 0 }))
    .sort((a,b) => a.pct - b.pct || a.reg.localeCompare(b.reg));   // menor cobertura no topo
  if (linhas.length < 2) return '';   // só compara com 2+ regionais
  const barras = linhas.map(l => {
    const cor = l.pct>=80 ? '#10b981' : l.pct>=50 ? '#f59e0b' : '#ef4444';
    const clic = l.reg !== 'Sem regional';
    return `<div class="pr-linha${clic?' clic':''}" ${clic?`data-reg="${escapar(l.reg)}" onclick="filtrarRegionalPainel(this)"`:''} title="${escapar(l.reg)}: ${l.visitadas}/${l.total} visitadas">
      <div class="pr-nome">${escapar(l.reg)}</div>
      <div class="pr-barra"><div class="pr-fill" style="width:${l.pct}%;background:${cor};"></div></div>
      <div class="pr-num">${l.visitadas}/${l.total} · <b style="color:${cor};">${l.pct}%</b></div>
    </div>`;
  }).join('');
  return `<div class="est-painel">
    <div class="est-painel-tit"><i class="bi bi-map-fill me-1"></i>Cobertura por Regional</div>
    <div class="pr-lista">${barras}</div>
    <div class="est-painel-nota">Ordenado da menor cobertura para a maior. Clique numa regional para filtrar.</div>
  </div>`;
}
function filtrarRegionalPainel(el) {
  const r = el.dataset.reg || '';
  const sel = document.getElementById('filtroEstRegional');
  if ([...sel.options].some(o => o.value === r)) { sel.value = r; mudarFiltroEst(); }
}

// B) Painel de Risco Pedagógico ─────────────────────────────────────────
function _painelRisco() {
  const c = { alto:0, medio:0, baixo:0, sem:0 };
  _coberturaCompleta.forEach(l => { c[_nivelRisco(l)]++; });
  if (!(c.alto + c.medio + c.baixo)) return '';   // sem devolutivas: nada a mostrar
  const chip = (k) => {
    const clic = k !== 'sem';
    const at = (filtroAtivo && filtroAtivo.tipo==='risco' && filtroAtivo.valor===k) ? ' ativo' : '';
    return `<div class="risco-chip${clic?' clic':''}${at}" style="--rc:${_COR_RISCO[k]};" ${clic?`onclick="filtrarKpi('risco','${k}')"`:''}>
      <div class="rc-val">${c[k]}</div><div class="rc-lbl">${_ROT_RISCO[k]}</div></div>`;
  };
  return `<div class="est-painel">
    <div class="est-painel-tit"><i class="bi bi-shield-exclamation me-1"></i>Risco Pedagógico</div>
    <div class="risco-grid">${chip('alto')}${chip('medio')}${chip('baixo')}${c.sem?chip('sem'):''}</div>
    <div class="est-painel-nota">Da devolutiva mais recente de cada escola. Clique num nível para filtrar a tabela.</div>
  </div>`;
}

// C) Temas Pedagógicos (categorização semântica das devolutivas) ─────────
// Em vez de contar palavras soltas, classificamos cada devolutiva em temas
// pedagógicos reconhecíveis. A taxonomia espelha os `desafios_comuns` das
// devolutivas de rede/regional. Uma escola pode cair em vários temas.
let _estSegs = [], _estRegFil = '';
function _normTxt(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
const _TEMAS = [
  { key:'ppa',    lbl:'Atribuição do PPA (2ºs anos)',    re:/\bppa\b|atribuic|2o ano|segundo ano/ },
  { key:'coord',  lbl:'Coordenação pedagógica',          re:/coordenac|coordenador/ },
  { key:'alfab',  lbl:'Alfabetização',                   re:/alfabetiza|fluencia|pre-silabic|silabic|hipotese de escrita|sondagem/ },
  { key:'espec',  lbl:'Educação Especial / inclusão',    re:/educacao especial|inclus|autist|\bnee\b|\btea\b|deficien|\blaudo\b|\baee\b/ },
  { key:'recup',  lbl:'Recuperação (PRP/PRA)',           re:/\bprp\b|\bpra\b|recuperac|reforco escolar/ },
  { key:'defas',  lbl:'Defasagem / transição EI→EF',     re:/defasag|pre-requisit|prerequisit|transic/ },
  { key:'ppp',    lbl:'PPP / projeto (Infantil)',        re:/\bppp\b|professora do projeto|projeto pedagog|projeto polit/ },
  { key:'rotina', lbl:'Rotina Estruturante',             re:/rotina estrutur/ },
  { key:'integr', lbl:'Horários no período integral',    re:/periodo integral|\bsono\b|alimentac|horario do projeto/ },
  { key:'acervo', lbl:'Acervo / espaços',                re:/acervo|espaco|materiais|biblioteca|brinqued|parque/ },
  { key:'regist', lbl:'Registros pedagógicos',           re:/registro/ },
  { key:'gestao', lbl:'Gestão / acompanhamento',         re:/sobrecarr|demanda administrativa|acumul|acompanhamento pedagog/ },
  { key:'formac', lbl:'Formação docente',                re:/formacao (continuada|docente|de professor)|formacao em|formacao dos professor/ },
  { key:'freq',   lbl:'Frequência / busca ativa',        re:/busca ativa|evasao|infrequen|frequencia dos (alun|estudant)/ }
];
function _txtDev(dev) {
  return _normTxt([].concat(
    dev.pontos_fracos||[], dev.pontos_atencao||[],
    dev.prioridade ? [dev.prioridade] : [],
    dev.justificativa_prioridade ? [dev.justificativa_prioridade] : [],
    (dev.risco_pedagogico && dev.risco_pedagogico.descricao) ? [dev.risco_pedagogico.descricao] : []
  ).join(' · '));
}
function _temasDaLinha(l) {
  const s = new Set();
  if (!l.dev) return s;
  const t = _txtDev(l.dev);
  _TEMAS.forEach(tm => { if (tm.re.test(t)) s.add(tm.key); });
  return s;
}
function _painelTemas() {
  const base = _coberturaCompleta.filter(l => l.dev).length;
  if (!base) return '';
  const cont = {}; _TEMAS.forEach(tm => cont[tm.key] = 0);
  _coberturaCompleta.forEach(l => _temasDaLinha(l).forEach(k => cont[k]++));
  const linhas = _TEMAS.filter(tm => cont[tm.key] > 0).sort((a,b) => cont[b.key] - cont[a.key]);
  if (linhas.length < 2) return '';
  const max = cont[linhas[0].key];
  const barras = linhas.map(tm => {
    const n = cont[tm.key], pct = Math.round(n/base*100);
    const at = (filtroAtivo && filtroAtivo.tipo==='tema' && filtroAtivo.valor===tm.key) ? ' ativo' : '';
    return `<div class="tema-linha clic${at}" onclick="filtrarKpi('tema','${tm.key}')" title="${escapar(tm.lbl)}: ${n} escola(s) · ${pct}%">
      <div class="tema-nome">${escapar(tm.lbl)}</div>
      <div class="tema-barra"><div class="tema-fill" style="width:${Math.round(n/max*100)}%;"></div></div>
      <div class="tema-num">${n}</div>
    </div>`;
  }).join('');
  return `<div class="est-painel">
    <div class="est-painel-tit"><i class="bi bi-diagram-3-fill me-1"></i>Temas Pedagógicos</div>
    <div class="tema-lista">${barras}</div>
    <div class="est-painel-nota">Categorias identificadas nas devolutivas de ${base} escola(s). Clique num tema para filtrar a tabela.</div>
  </div>`;
}

// C2) Concentração de Temas por Regional (heatmap) ──────────────────────
function _regCurto(r) {
  const m = String(r).match(/regional\s*0*(\d+)/i);
  if (m) return 'R' + m[1];
  return String(r).length > 12 ? String(r).slice(0, 11) + '…' : String(r);
}
function _painelConcentracao() {
  const regs = [...new Set(_coberturaCompleta
    .filter(l => l.dev && l.regional && l.regional !== '—').map(l => l.regional))].sort();
  if (regs.length < 2) return '';
  const mat = {}, tot = {};
  _TEMAS.forEach(tm => { mat[tm.key] = {}; tot[tm.key] = 0; });
  _coberturaCompleta.forEach(l => {
    if (!l.dev) return;
    const reg = (l.regional && l.regional !== '—') ? l.regional : null;
    _temasDaLinha(l).forEach(k => { tot[k]++; if (reg) mat[k][reg] = (mat[k][reg]||0) + 1; });
  });
  const temas = _TEMAS.filter(tm => tot[tm.key] > 0).sort((a,b) => tot[b.key] - tot[a.key]);
  if (!temas.length) return '';
  const maxCell = Math.max(1, ...temas.flatMap(tm => regs.map(r => mat[tm.key][r]||0)));
  const th = regs.map(r => `<th class="hm-rot" title="${escapar(r)}">${escapar(_regCurto(r))}</th>`).join('');
  const rows = temas.map(tm => {
    const tds = regs.map(r => {
      const n = mat[tm.key][r] || 0;
      const a = n ? (0.12 + 0.88 * n / maxCell) : 0;
      return `<td class="hm-cel" style="background:rgba(2,43,94,${a.toFixed(2)});color:${a>0.55?'#fff':'#334155'};">${n||''}</td>`;
    }).join('');
    return `<tr><td class="hm-tema">${escapar(tm.lbl)} <span class="hm-tot">${tot[tm.key]}</span></td>${tds}</tr>`;
  }).join('');
  return `<div class="est-painel est-painel-wide">
    <div class="est-painel-tit"><i class="bi bi-grid-3x3-gap-fill me-1"></i>Concentração de Temas por Regional</div>
    <div class="hm-wrap"><table class="hm-tbl">
      <thead><tr><th class="hm-canto">Tema \\ Regional</th>${th}</tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="est-painel-nota">Nº de escolas com cada tema, por regional. Célula mais escura = maior concentração. Passe o mouse no cabeçalho para o nome completo.</div>
  </div>`;
}

// C3) Leitura da Rede/Regional (IA) — síntese qualitativa já escrita ─────
// Traz para as Estatísticas os campos das devolutivas de REDE (sintese_global)
// ou, se houver regional filtrada, da devolutiva REGIONAL correspondente.
function _devsSinteseRelevantes() {
  const isSeg = s => _estSegs.includes(String(s||'').toLowerCase());
  const devs = _estRegFil
    ? todasDevolutivas.filter(d => d._tipo === 'regional' && isSeg(d["Segmento"]) && (d["Regional"]||'') === _estRegFil)
    : todasDevolutivas.filter(d => d._tipo === 'sintese_global' && isSeg(d["Segmento"]));
  const porChave = new Map();
  devs.forEach(d => {
    const k = d._chave || _chaveDev(d["Segmento"], d["Escola"], d["Data da Visita"]);
    const cur = porChave.get(k);
    if (!cur || _tsDev(d) > _tsDev(cur)) porChave.set(k, d);
  });
  return [...porChave.values()];
}
function _painelLeituraRede() {
  const devs = _devsSinteseRelevantes();
  if (!devs.length) return '';
  const sec = (titulo, arr, ic, cor) => {
    const items = (arr||[]).slice(0, 6).map(x => {
      const txt = (x && typeof x === 'object') ? (x.prioridade || x.desafio || x.texto || '') : x;
      const niv = (x && typeof x === 'object' && x.nivel) ? ` <span class="lr-niv">${escapar(x.nivel)}</span>` : '';
      return txt ? `<li>${escapar(txt)}${niv}</li>` : '';
    }).join('');
    return items ? `<div class="lr-sec"><div class="lr-sec-tit" style="color:${cor};"><i class="bi ${ic} me-1"></i>${titulo}</div><ul class="lr-ul">${items}</ul></div>` : '';
  };
  const blocos = devs.map(dev => {
    const d = dev._dados || {};
    const tit = dev._tipo === 'regional' ? (dev["Regional"] || 'Regional')
      : ('Rede — ' + (_rotuloSegmento(dev["Segmento"]) || 'Geral'));
    const modelo = _rotuloModelo(dev["_modelo"]);
    return `<div class="lr-bloco">
      <div class="lr-cab">${escapar(tit)}${modelo ? ` <span class="lr-modelo">${escapar(modelo)}</span>` : ''}</div>
      ${d.sintese_executiva ? `<div class="lr-sintese">${escapar(d.sintese_executiva)}</div>` : ''}
      <div class="lr-cols">
        ${sec('Desafios comuns', d.desafios_comuns, 'bi-exclamation-triangle-fill', '#b45309')}
        ${sec('Prioridades', d.prioridades_da_rede, 'bi-flag-fill', '#b91c1c')}
        ${sec('Alertas para a gestão', d.alertas_para_gestao, 'bi-shield-exclamation', '#b91c1c')}
        ${sec('Boas práticas', d.boas_praticas_para_socializar, 'bi-share-fill', '#0e7490')}
      </div>
    </div>`;
  }).join('');
  const alvo = _estRegFil ? 'Regional' : 'Rede';
  return `<div class="est-painel est-painel-wide">
    <div class="est-painel-tit"><i class="bi bi-stars me-1"></i>Leitura da ${alvo} (IA)</div>
    <div class="lr-grid">${blocos}</div>
    <div class="est-painel-nota">Síntese qualitativa da devolutiva de ${_estRegFil ? 'regional' : 'rede'}. O texto completo (recomendações, ações formativas etc.) está na aba Devolutivas.</div>
  </div>`;
}

// D) Evolução Temporal (visitas por mês) ────────────────────────────────
function _painelTemporal() {
  return `<div class="est-painel est-painel-wide">
    <div class="est-painel-tit"><i class="bi bi-graph-up me-1"></i>Evolução das Visitas</div>
    <div style="position:relative;height:210px;"><canvas id="canvasTemporal"></canvas></div>
  </div>`;
}
function _desenharTemporal() {
  const buckets = {};
  _coberturaCompleta.forEach(l => (l.datas||[]).forEach(d => {
    const k = d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2);
    buckets[k] = (buckets[k]||0) + 1;
  }));
  const keys = Object.keys(buckets).sort();
  if (chartTemporal) { chartTemporal.destroy(); chartTemporal = null; }
  const ctx = document.getElementById('canvasTemporal');
  if (!ctx || typeof Chart === 'undefined' || !keys.length) return;
  const labels = keys.map(k => { const [y,m] = k.split('-'); return _MESES_AB[+m-1] + '/' + y.slice(2); });
  const data = keys.map(k => buckets[k]);
  const temDL = typeof ChartDataLabels !== 'undefined';
  const cfg = {
    type: 'bar',
    data: { labels, datasets: [{ label:'Visitas', data, backgroundColor:'#00b4d8', borderRadius:6, maxBarThickness:46 }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins: {
        legend: { display:false },
        datalabels: temDL ? { anchor:'end', align:'end', color:'#0369a1', font:{ family:'Inter', weight:'bold', size:11 }, formatter:v=>v||'' } : undefined
      },
      scales: { y:{ beginAtZero:true, ticks:{ precision:0 } }, x:{ grid:{ display:false } } }
    }
  };
  if (temDL) cfg.plugins = [ChartDataLabels];
  chartTemporal = new Chart(ctx, cfg);
}

// E) Tempo desde a Última Visita (envelhecimento) ───────────────────────
function _statsIdade() {
  const now = Date.now(), b = { d30:0, d60:0, d90:0, mais:0 };
  _coberturaCompleta.forEach(l => {
    if (!l.ultima) return;
    const dias = Math.floor((now - l.ultima.getTime()) / 86400000);
    if (dias<=30) b.d30++; else if (dias<=60) b.d60++; else if (dias<=90) b.d90++; else b.mais++;
  });
  return b;
}
function _painelIdade() {
  const b = _statsIdade();
  if (!(b.d30+b.d60+b.d90+b.mais)) return '';
  const chip = (k, rot, cor) => {
    const at = (filtroAtivo && filtroAtivo.tipo==='idade' && filtroAtivo.valor===k) ? ' ativo' : '';
    return `<div class="idade-chip clic${at}" style="--ic:${cor};" onclick="filtrarKpi('idade','${k}')">
      <div class="rc-val">${b[k]}</div><div class="rc-lbl">${rot}</div></div>`;
  };
  return `<div class="est-painel">
    <div class="est-painel-tit"><i class="bi bi-clock-history me-1"></i>Tempo desde a Última Visita</div>
    <div class="risco-grid">
      ${chip('d30','Até 30 dias','#10b981')}
      ${chip('d60','31–60 dias','#f59e0b')}
      ${chip('d90','61–90 dias','#fb923c')}
      ${chip('mais','+90 dias','#ef4444')}
    </div>
    <div class="est-painel-nota">Apenas escolas já visitadas. Clique numa faixa para filtrar a tabela.</div>
  </div>`;
}

// F) Backlog de Devolutivas (visitadas sem devolutiva) ──────────────────
function _painelBacklog() {
  const pend = _coberturaCompleta.filter(l => l.nVisitas>0 && !l.temDev)
    .sort((a,b) => (b.ultima?b.ultima.getTime():0) - (a.ultima?a.ultima.getTime():0));
  if (!pend.length) {
    return `<div class="est-painel">
      <div class="est-painel-tit"><i class="bi bi-inbox me-1"></i>Devolutivas Pendentes</div>
      <div class="backlog-vazio"><i class="bi bi-check-circle-fill me-1"></i>Todas as escolas visitadas já têm devolutiva.</div>
    </div>`;
  }
  const itens = pend.slice(0, 10).map(l => `
    <div class="backlog-item">
      <div class="bk-nome">${escapar(l.escola)}</div>
      <div class="bk-meta">${escapar(l.regional)} · ${l.nVisitas} visita${l.nVisitas!==1?'s':''} · última ${_fmtData(l.ultima)}</div>
    </div>`).join('');
  const resto = pend.length > 10 ? `<div class="est-painel-nota">+${pend.length-10} escola(s) além das 10 mais recentes.</div>` : '';
  return `<div class="est-painel">
    <div class="est-painel-tit"><i class="bi bi-inbox me-1"></i>Devolutivas Pendentes
      <span class="bk-badge clic" onclick="filtrarKpi('pendente')" title="Filtrar a tabela pelas pendentes">${pend.length}</span></div>
    <div class="backlog-lista">${itens}</div>
    ${resto}
  </div>`;
}

function renderEstatisticas() {
  const main = document.getElementById('main');
  if (!escolasOficiais.fundamental.length && !escolasOficiais.infantil.length
      && !(dadosPorSegmento.fundamental||[]).length && !(dadosPorSegmento.infantil||[]).length) {
    mostrarEstado('Sem dados para estatísticas.', 'bi-bar-chart');
    return;
  }
  const segSel = document.getElementById('filtroEstSegmento').value;
  const segs = segSel === 'todos' ? ['fundamental','infantil'] : [segSel];

  const completa = _construirCobertura(segs);

  // Popula filtro de regionais preservando a seleção
  const selReg = document.getElementById('filtroEstRegional');
  const regAtual = selReg.value;
  const regionais = [...new Set(completa.map(l => l.regional).filter(r => r && r !== '—'))].sort();
  selReg.innerHTML = '<option value="">Todas as Regionais</option>' +
    regionais.map(r => `<option value="${escapar(r)}">${escapar(r)}</option>`).join('');
  selReg.value = regionais.includes(regAtual) ? regAtual : '';

  const regFil = selReg.value;
  const busca = document.getElementById('buscaEst').value.trim().toLowerCase();
  _coberturaCompleta = completa.filter(l =>
    (!regFil || l.regional === regFil) && (!busca || l.escola.toLowerCase().includes(busca)));
  _estSegs = segs; _estRegFil = regFil;   // contexto p/ painéis de síntese (IA)

  // Métricas agregadas (sempre sobre o conjunto filtrado, independente do KPI ativo)
  const total = _coberturaCompleta.length;
  const visitadas = _coberturaCompleta.filter(l => l.nVisitas > 0).length;
  const totalVisitas = _coberturaCompleta.reduce((s,l) => s + l.nVisitas, 0);
  const comDev = _coberturaCompleta.filter(l => l.temDev).length;
  const cobertura = total ? Math.round(visitadas/total*100) : 0;

  // Contagem por frequência de visitas (1 KPI por quantidade)
  const contagem = {};
  _coberturaCompleta.forEach(l => { contagem[l.nVisitas] = (contagem[l.nVisitas]||0) + 1; });
  const freqs = Object.keys(contagem).map(Number).sort((a,b) => a-b);

  // Métricas derivadas das devolutivas
  const riscoAlto = _coberturaCompleta.filter(l => _nivelRisco(l) === 'alto').length;
  const pendentes = visitadas - comDev;

  const ativoFreq = f => (filtroAtivo && filtroAtivo.tipo==='freq' && filtroAtivo.valor===f) ? 'ativo' : '';
  const ativoTipo = (t,v) => (filtroAtivo && filtroAtivo.tipo===t && (v===undefined || filtroAtivo.valor===v)) ? 'ativo' : '';

  // KPI "Escolas" (limpa o filtro) + 1 KPI por frequência + Cobertura + Total + Com devolutiva + Risco alto + Pendentes
  const kpiEscolas = `<div class="est-kpi info clic ${filtroAtivo?'':'ativo'}" onclick="filtrarKpi(null)"><div class="lbl">Escolas</div><div class="val">${total}</div></div>`;
  const kpisFreq = freqs.map(f => {
    const cor = _corFreq(f);
    return `<div class="est-kpi clic ${ativoFreq(f)}" style="border-left-color:${cor};" onclick="filtrarKpi('freq',${f})"><div class="lbl">${_rotuloFreq(f)}</div><div class="val" style="color:${cor};">${contagem[f]}</div></div>`;
  }).join('');
  const kpiCobertura = `<div class="est-kpi"><div class="lbl">Cobertura</div><div class="val">${cobertura}%</div></div>`;
  const kpiTotalVis  = `<div class="est-kpi"><div class="lbl">Total de visitas</div><div class="val">${totalVisitas}</div></div>`;
  const kpiDev       = `<div class="est-kpi dev clic ${ativoTipo('dev')}" onclick="filtrarKpi('dev')"><div class="lbl">Com devolutiva</div><div class="val">${comDev}</div></div>`;
  const kpiRisco     = riscoAlto ? `<div class="est-kpi warn clic ${ativoTipo('risco','alto')}" onclick="filtrarKpi('risco','alto')"><div class="lbl">Risco alto</div><div class="val">${riscoAlto}</div></div>` : '';
  const kpiPend      = pendentes ? `<div class="est-kpi clic ${ativoTipo('pendente')}" style="border-left-color:#f59e0b;" onclick="filtrarKpi('pendente')"><div class="lbl">Dev. pendentes</div><div class="val" style="color:#b45309;">${pendentes}</div></div>` : '';

  const kpis = `<div class="est-kpis-grid mb-3">${kpiEscolas}${kpisFreq}${kpiCobertura}${kpiTotalVis}${kpiDev}${kpiRisco}${kpiPend}</div>`;

  main.innerHTML = `
    ${kpis}
    <div class="est-paineis">
      ${_painelLeituraRede()}
      ${_painelCoberturaRegional()}
      ${_painelRisco()}
      ${_painelIdade()}
      ${_painelBacklog()}
      ${_painelTemas()}
      ${_painelConcentracao()}
      ${_painelTemporal()}
    </div>
    <div class="table-container" id="cob-tabela"></div>`;

  _desenharDonut(_coberturaCompleta);
  _desenharTemporal();
  _refreshTabelaCob();
}

// Mudança nos filtros da lateral (segmento/regional/busca) zera o KPI ativo
function mudarFiltroEst() { filtroAtivo = null; renderEstatisticas(); }

// Aplica filtro a partir de um KPI / fatia do donut / painel (alterna se já ativo).
// Tipos: 'freq' (valor=N) · 'dev' · 'pendente' · 'risco' (valor=alto|medio|baixo) · 'idade' (valor=d30|d60|d90|mais)
function filtrarKpi(tipo, valor) {
  if (tipo === null) filtroAtivo = null;
  else {
    const igual = filtroAtivo && filtroAtivo.tipo === tipo && (valor === undefined || filtroAtivo.valor === valor);
    filtroAtivo = igual ? null : (valor === undefined ? { tipo } : { tipo, valor });
  }
  renderEstatisticas();
}

// Distribuição de escolas por nº de visitas (donut clicável)
function _desenharDonut(lista) {
  const contagem = {};
  lista.forEach(l => { contagem[l.nVisitas] = (contagem[l.nVisitas]||0) + 1; });
  _estFreqs = Object.keys(contagem).map(Number).sort((a,b) => a-b);
  const labels = _estFreqs.map(f => _rotuloFreq(f));
  const data   = _estFreqs.map(f => contagem[f]);
  const bg     = _estFreqs.map(f => _corFreq(f));
  const totalN = data.reduce((s,n) => s+n, 0);

  if (chartCobertura) { chartCobertura.destroy(); chartCobertura = null; }
  const ctx = document.getElementById('canvasCobertura');
  if (!ctx || typeof Chart === 'undefined') return;

  const temDL = typeof ChartDataLabels !== 'undefined';
  const cfg = {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: bg, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '62%',
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'Inter', weight: 'bold', size: 11 } } },
        datalabels: temDL ? {
          color: c => { const hex = c.dataset.backgroundColor[c.dataIndex]; return ['#39c46e','#FFD300','#00b4d8'].includes(hex) ? '#002b5e' : '#fff'; },
          font: { family: 'Inter', weight: 'bold', size: 13 },
          formatter: v => { const p = Math.round(v/totalN*100); return p >= 5 ? p+'%' : ''; }
        } : undefined
      },
      onClick: (evt, els) => { if (els.length) filtrarKpi('freq', _estFreqs[els[0].index]); else filtrarKpi(null); }
    }
  };
  if (temDL) cfg.plugins = [ChartDataLabels];
  chartCobertura = new Chart(ctx, cfg);
}

// Lista exibida na tabela = conjunto filtrado, opcionalmente recortado pela fatia do donut, ordenado
function _listaTabela() {
  let lista = _coberturaCompleta.slice();
  const f = filtroAtivo;
  if (f) {
    if      (f.tipo === 'freq')     lista = lista.filter(l => l.nVisitas === f.valor);
    else if (f.tipo === 'dev')      lista = lista.filter(l => l.temDev);
    else if (f.tipo === 'pendente') lista = lista.filter(l => l.nVisitas > 0 && !l.temDev);
    else if (f.tipo === 'risco')    lista = lista.filter(l => _nivelRisco(l) === f.valor);
    else if (f.tipo === 'tema')     lista = lista.filter(l => _temasDaLinha(l).has(f.valor));
    else if (f.tipo === 'idade')    lista = lista.filter(l => {
      if (!l.ultima) return false;
      const dias = Math.floor((Date.now() - l.ultima.getTime()) / 86400000);
      return f.valor==='d30' ? dias<=30 : f.valor==='d60' ? (dias>30 && dias<=60) : f.valor==='d90' ? (dias>60 && dias<=90) : dias>90;
    });
  }
  _ordenarLista(lista);
  return lista;
}

// Edição da regional de uma escola (super admin). Grava em relatorios_escolas via RPC
// (marca regional_manual=true → o sync não sobrescreve). Atualiza o mapa em memória e
// re-renderiza as Estatísticas.
async function editarRegional(el) {
  if (!isAdmin || !window.MAPA_SB) return;
  const segKey = el.dataset.seg, escola = el.dataset.escola, atual = el.dataset.reg || '';
  const conhecidas = [...new Set(
    Object.values(mapaRegionalOficial).flatMap(m => Object.values(m || {}))
  )].filter(Boolean).sort();
  const dica = conhecidas.length ? '\n\nRegionais já em uso:\n• ' + conhecidas.join('\n• ') : '';
  const nova = prompt(`Regional de "${escola}"\n(vazio remove a regional):${dica}`, atual);
  if (nova === null) return;                 // cancelou
  const val = nova.trim();
  try {
    const { error } = await window.MAPA_SB.rpc('relat_set_regional',
      { p_segmento: segKey, p_nome: escola, p_regional: val });
    if (error) throw error;
    mapaRegionalOficial[segKey] = mapaRegionalOficial[segKey] || {};
    if (val) mapaRegionalOficial[segKey][escola] = val;
    else delete mapaRegionalOficial[segKey][escola];
    mostrarToast('Regional atualizada.');
    renderEstatisticas();
  } catch (e) {
    mostrarToast('Falha ao salvar: ' + (e.message || e));
  }
}

function verTodasFreq() { filtrarKpi(null); }

function ordenarCobertura(campo) {
  if (ordemCob.campo === campo) ordemCob.asc = !ordemCob.asc;
  else { ordemCob.campo = campo; ordemCob.asc = true; }
  _refreshTabelaCob();
}

function _ordenarLista(lista) {
  const c = ordemCob.campo, mult = ordemCob.asc ? 1 : -1;
  lista.sort((a,b) => {
    let va, vb;
    if (c === 'status')      { va = a.nVisitas>0?1:0; vb = b.nVisitas>0?1:0; }
    else if (c === 'temDev') { va = a.temDev?1:0;     vb = b.temDev?1:0; }
    else if (c === 'ultima') { va = a.ultima?a.ultima.getTime():0; vb = b.ultima?b.ultima.getTime():0; }
    else if (c === 'risco')  { const o={alto:3,medio:2,baixo:1,sem:0}; va=o[_nivelRisco(a)]; vb=o[_nivelRisco(b)]; }
    else { va = a[c]; vb = b[c]; }
    if (typeof va === 'string') return va.localeCompare(vb) * mult;
    return (va - vb) * mult;
  });
}

function exportarCoberturaCSV() {
  const lista = _listaTabela();
  if (!lista.length) { mostrarToast('Nada para exportar.'); return; }
  const cab = ['Unidade Escolar','Regional','Segmento','Nº de visitas','Última visita','Status','Devolutiva','Risco pedagógico'];
  const linhas = lista.map(l => [
    l.escola, l.regional, l.segmento, l.nVisitas, _fmtData(l.ultima),
    l.nVisitas>0?'Visitada':'Sem visita', l.temDev?'Sim':'Não',
    _nivelRisco(l)==='sem' ? '' : _ROT_RISCO[_nivelRisco(l)]
  ]);
  const csv = [cab, ...linhas].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['﻿'+csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'cobertura_visitas.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  mostrarToast('CSV exportado!');
}

// markdown mínimo e seguro (escapa antes; só negrito e bullets)
function _mdSimples(t) {
  let s = escapar(t);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/^\s*[-*]\s+(.+)$/gm, '• $1');
  return s.replace(/\n/g, '<br>');
}

async function enviarPergunta(texto) {
  if (_chatEnviando) return;
  const inp = document.getElementById('chatInput');
  const pergunta = String(texto || (inp && inp.value) || '').trim();
  if (!pergunta) return;
  if (inp) { inp.value = ''; inp.style.height = 'auto'; }
  const histPrev = _chatHistorico.filter(m => m.texto).slice(-6);
  _chatHistorico.push({ role: 'user', texto: pergunta });
  _chatEnviando = true;
  _renderChatMsgs();
  try {
    await _carregarAux();   // garante Fluência/Elefante no contexto (cacheado)
    const res = await chamarAPI('chat', {
      pergunta: pergunta,
      contexto: _contextoChat(),
      historico: JSON.stringify(histPrev),
      usuario: emailUsuario || ''
    });
    _chatHistorico.push({ role: 'assistant',
      texto: (res && res.ok) ? (res.resposta || '(sem resposta)')
                             : ('⚠️ ' + ((res && res.erro) || 'Não foi possível responder agora.')) });
  } catch (e) {
    _chatHistorico.push({ role: 'assistant', texto: '⚠️ Erro de conexão com o assistente: ' + (e.message || e) });
  } finally {
    _chatEnviando = false;
    _renderChatMsgs();
  }
}

        const a = (o[t.avaliacao] = o[t.avaliacao] || {aval:0,flu:0,ini:0,n1:0,n2:0,n3:0,n4:0,aus:0,tot:0});
        a.aval+=+t.avaliados||0; a.flu+=+t.fluentes||0; a.ini+=+t.iniciantes||0;
        a.n1+=+t.pre_n1||0; a.n2+=+t.pre_n2||0; a.n3+=+t.pre_n3||0; a.n4+=+t.pre_n4||0;
        a.aus+=+t.ausentes||0; a.tot+=+t.total_estudantes||0;
      });
      _fluPorEscola = {};
      Object.keys(porEA).forEach(e => { const avs = Object.keys(porEA[e]).sort(); const av = avs[avs.length-1];
        _fluPorEscola[e] = Object.assign({ avaliacao: av }, porEA[e][av]); });
    } catch(e){ console.warn('Fluência indisponível:', e.message); }
    // Elefante (elefante_turmas + elefante_escolas) → agrega por escola, mês mais recente
    try {
      const meses = await _auxFetch('elefante_turmas?select=mes_referencia&order=mes_referencia.desc&limit=1');
      if (meses.length) {
        const mes = meses[0].mes_referencia;
        let turmas = await _auxFetch(`elefante_turmas?mes_referencia=eq.${encodeURIComponent(mes)}&select=escola,estudantes,leitores,livros_lidos`);
        turmas = filtrar(turmas, t => t.escola);
        const porE = {};
        turmas.forEach(t => { const e = canon(t.escola);
          const o = (porE[e] = porE[e] || {est:0,lei:0,liv:0,leit:null,mes:mes});
          o.est+=+t.estudantes||0; o.lei+=+t.leitores||0; o.liv+=+t.livros_lidos||0; });
        try {
          let esc = await _auxFetch(`elefante_escolas?mes_referencia=eq.${encodeURIComponent(mes)}&select=nome_escola,leituras_concluidas`);
          esc = filtrar(esc, r => r.nome_escola);
          esc.forEach(r => { const e = canon(r.nome_escola); const o = (porE[e] = porE[e] || {est:0,lei:0,liv:0,leit:null,mes:mes});
            o.leit = (o.leit||0) + (+r.leituras_concluidas||0); });
        } catch(e){}
        _elePorEscola = porE;
      }
    } catch(e){ console.warn('Elefante indisponível:', e.message); }
  })();
  return _auxPromise;
}

// Formata uma devolutiva individual COMPLETA (todos os campos) para o contexto do chat.
function _devTxtCompleto(d) {
  const L = a => (a || []).filter(Boolean).join('; ');
  const p = [];
  if (d.sintese_executiva) p.push('Síntese: ' + d.sintese_executiva);
  if (d.prioridade) p.push('Prioridade: ' + d.prioridade + (d.justificativa_prioridade ? ' (' + d.justificativa_prioridade + ')' : ''));
  const r = d.risco_pedagogico || {};
  if (r.nivel) p.push('Risco: ' + r.nivel + (r.descricao ? ' — ' + r.descricao : ''));
  if ((d.pontos_fortes || []).length)  p.push('Pontos fortes: ' + L(d.pontos_fortes));
  if ((d.pontos_fracos || []).length)  p.push('Pontos fracos: ' + L(d.pontos_fracos));
  if ((d.pontos_atencao || []).length) p.push('Pontos de atenção: ' + L(d.pontos_atencao));
  if ((d.encaminhamentos_proxima_visita || []).length) p.push('Encaminhamentos: ' + L(d.encaminhamentos_proxima_visita));
  if ((d.perguntas_para_proxima_visita || []).length)  p.push('Perguntas p/ próxima visita: ' + L(d.perguntas_para_proxima_visita));
  if ((d.foco_formativo_sugerido || []).length) p.push('Foco formativo: ' + L(d.foco_formativo_sugerido));
  return p.join(' | ');
}

function _contextoChat() {
  const linhas = _construirCobertura(['fundamental','infantil']);
  const total = linhas.length, vis = linhas.filter(l => l.nVisitas > 0).length;
  const cob = total ? Math.round(vis / total * 100) : 0;

  // escolas com visita, ordenadas da mais recente para a mais antiga (p/ perguntas de data)
  const comVisita = linhas.filter(l => l.ultima).sort((a,b) => b.ultima.getTime() - a.ultima.getTime());
  const maisRecente = comVisita[0];

  const porReg = {};
  linhas.forEach(l => {
    const r = (l.regional && l.regional !== '—') ? l.regional : 'Sem regional';
    const o = porReg[r] || (porReg[r] = { t:0, v:0 }); o.t++; if (l.nVisitas > 0) o.v++;
  });
  const regTxt = Object.entries(porReg).sort((a,b) => a[0].localeCompare(b[0]))
    .map(([r,o]) => `${r}: ${o.v}/${o.t} (${o.t?Math.round(o.v/o.t*100):0}%)`).join('; ');

  const risc = { alto:0, medio:0, baixo:0 };
  linhas.forEach(l => { const n = _nivelRisco(l); if (risc[n] !== undefined) risc[n]++; });

  const cont = {}; _TEMAS.forEach(t => cont[t.key] = 0);
  linhas.forEach(l => _temasDaLinha(l).forEach(k => cont[k]++));
  const temasTxt = _TEMAS.filter(t => cont[t.key] > 0).sort((a,b) => cont[b.key]-cont[a.key])
    .map(t => `${t.lbl} (${cont[t.key]})`).join('; ');

  // Regional por escola (chave = nome normalizado) — permite agrupar Fluência/
  // Elefante por regional, já que aquelas fontes não trazem a regional.
  const _regByNorm = {};
  linhas.forEach(l => { if (l.regional && l.regional !== '—') _regByNorm[_auxNormEscola(l.escola)] = l.regional; });
  const _regDe = nome => _regByNorm[_auxNormEscola(nome)] || '';

  // ═══ ESSENCIAL — montado PRIMEIRO e nunca truncado (resumo, fluência,
  //     elefante, devolutivas de rede/regional e por escola) ═══
  let ctx = 'RESUMO DA REDE (apenas escolas que você pode ver):\n';
  ctx += `- Escolas: ${total} | Visitadas: ${vis} (${cob}%) | Sem visita: ${total - vis}\n`;
  if (maisRecente) ctx += `- Visita mais recente da rede: ${maisRecente.escola} em ${_fmtData(maisRecente.ultima)}\n`;
  ctx += `- Cobertura por regional: ${regTxt || '—'}\n`;
  ctx += `- Risco pedagógico: alto ${risc.alto}, médio ${risc.medio}, baixo ${risc.baixo}\n`;
  ctx += `- Temas mais frequentes: ${temasTxt || '—'}\n`;

  // Fluência Leitora (por escola, com regional resolvida pelo cadastro dos relatórios).
  if (_fluPorEscola && Object.keys(_fluPorEscola).length) {
    ctx += '\nFLUÊNCIA LEITORA (por escola, avaliação mais recente; níveis do menos ao mais avançado: N1, N2, N3, N4, iniciante, fluente):\n';
    Object.keys(_fluPorEscola).sort().forEach(e => { const f = _fluPorEscola[e]; const reg = _regDe(e);
      const pct = f.aval > 0 ? Math.round(f.flu / f.aval * 100) : 0;
      ctx += `• ${e}${reg ? ` [${reg}]` : ''} — ${f.avaliacao || ''}: ${f.aval} avaliados, ${f.flu} fluentes (${pct}%), iniciantes ${f.ini}, N1 ${f.n1}, N2 ${f.n2}, N3 ${f.n3}, N4 ${f.n4}, ausentes ${f.aus}\n`;
    });
  } else {
    ctx += '\n(Fluência Leitora: dados indisponíveis nesta sessão.)\n';
  }
  // Elefante Letrado (por escola, com regional).
  if (_elePorEscola && Object.keys(_elePorEscola).length) {
    ctx += '\nELEFANTE LETRADO (por escola, mês mais recente; engajamento = leitores/estudantes):\n';
    Object.keys(_elePorEscola).sort().forEach(e => { const g = _elePorEscola[e]; const reg = _regDe(e);
      const eng = g.est > 0 ? Math.round(g.lei / g.est * 100) : 0;
      ctx += `• ${e}${reg ? ` [${reg}]` : ''} — ${g.est} estudantes, ${g.lei} leitores (${eng}% engajamento), ${g.liv} livros lidos${g.leit != null ? `, ${g.leit} leituras concluídas` : ''}\n`;
    });
  }

  const rede = todasDevolutivas.filter(d => d._tipo === 'sintese_global');
  if (rede.length) {
    ctx += '\nDEVOLUTIVAS DE REDE:\n';
    rede.forEach(d => { const x = d._dados || {};
      ctx += `• Rede ${_rotuloSegmento(d["Segmento"]) || ''}: ${x.sintese_executiva || ''}\n`;
      if ((x.desafios_comuns || []).length) ctx += `  Desafios comuns: ${x.desafios_comuns.join('; ')}\n`;
      if ((x.alertas_para_gestao || []).length) ctx += `  Alertas: ${x.alertas_para_gestao.join('; ')}\n`;
    });
  }
  const regionais = todasDevolutivas.filter(d => d._tipo === 'regional');
  if (regionais.length) {
    ctx += '\nDEVOLUTIVAS REGIONAIS:\n';
    regionais.forEach(d => { const x = d._dados || {};
      ctx += `• ${d["Regional"] || 'Regional'} (${_rotuloSegmento(d["Segmento"]) || ''}): ${(x.desafios_comuns || []).slice(0,4).join('; ')}\n`;
    });
  }

  if (comVisita.length) {
    ctx += `\nESCOLAS VISITADAS (${comVisita.length}) — da visita mais recente para a mais antiga:\n`;
    comVisita.forEach(l => {
      ctx += `• ${l.escola} [${l.regional}] ${l.segmento} — ${l.nVisitas} visita(s), última em ${_fmtData(l.ultima)}`;
      if (l.dev) ctx += `\n   ${_devTxtCompleto(l.dev)}`;
      ctx += '\n';
    });
  }
  const semVisita = linhas.filter(l => l.nVisitas === 0).map(l => l.escola);
  if (semVisita.length) {
    ctx += `\nESCOLAS SEM VISITA (${semVisita.length}): ${semVisita.join('; ')}\n`;
  }

  // ═══ REGISTROS BRUTOS — preenchem só o espaço que sobrar até o teto. Nunca
  //     empurram o essencial acima para fora; truncam-se sozinhos se faltar espaço. ═══
  let raw = '\n\nREGISTROS DETALHADOS DAS VISITAS (respostas do formulário):\n';
  ['fundamental','infantil'].forEach(seg => {
    (dadosPorSegmento[seg] || []).forEach(v => {
      const escola = v['_ESCOLA_'] || '';
      const data = v['Data da Visita:'] || v['Data da visita:'] || v['Carimbo de data/hora'] || '';
      raw += `\n[${escola} — ${data}]\n`;
      Object.keys(v).forEach(k => {
        if (!k || k.charAt(0) === '_' || k === 'Carimbo de data/hora' || k === 'Endereço de e-mail') return;
        const val = String(v[k] == null ? '' : v[k]).trim();
        if (val) raw += `  ${k}: ${val}\n`;
      });
    });
  });

  const MAX = 200000;                      // teto total (~50k tokens); o essencial acima nunca é cortado
  const restante = MAX - ctx.length;
  if (restante > 3000) {
    ctx += raw.length <= restante ? raw
         : (raw.slice(0, restante) + '\n[... registros brutos truncados por tamanho; resumo, fluência, elefante e devolutivas acima estão COMPLETOS ...]');
  } else {
    ctx += '\n\n(Registros brutos das visitas omitidos por tamanho; resumo, fluência, elefante e devolutivas acima estão completos.)';
  }
  return ctx;
}

(function(){ var done=false; function go(){ if(done)return; done=true; carregarDados(); }
  if(window.MapaAuth && window.MapaAuth.perfil) return go();
  document.addEventListener('mapa-auth-pronto', go, {once:true});
  setTimeout(go, 8000);
})();
